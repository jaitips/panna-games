<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rocket Lab — Play Zone</title>
<link rel="icon" href="../../shared/icon.svg">
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05070f;color:#fff;
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#c,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
#home{position:fixed;top:10px;left:10px;z-index:30;width:46px;height:46px;border-radius:50%;background:rgba(10,16,40,.6);
  font-size:22px;display:flex;align-items:center;justify-content:center;text-decoration:none;backdrop-filter:blur(6px)}

/* ── mission menu ── */
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;
  background:linear-gradient(180deg,rgba(5,8,25,.55),rgba(5,8,25,.82));padding:16px;overflow:auto}
#menu h1{font-size:clamp(30px,6vw,60px);letter-spacing:1px;text-shadow:0 4px 0 #1b2a6b,0 0 30px rgba(120,180,255,.6)}
#menu p{font-size:clamp(14px,2.2vw,20px);opacity:.85;text-align:center}
#missions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:1000px}
.mcard{width:clamp(140px,17vw,180px);padding:14px 10px;border-radius:22px;background:rgba(30,45,110,.85);border:3px solid rgba(140,180,255,.5);
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s}
.mcard:active{transform:scale(.95)}
.mcard .ic{font-size:44px}.mcard .nm{font-size:17px;font-weight:800;text-align:center}.mcard .gl{font-size:12.5px;opacity:.8;text-align:center}
.mcard .st{font-size:20px;letter-spacing:2px}
.mcard.locked{filter:grayscale(1);opacity:.45;pointer-events:none}

/* ── builder ── */
#builder{position:fixed;z-index:15;right:0;top:0;bottom:0;width:min(47vw,540px);padding:12px 14px;overflow-y:auto;
  background:rgba(8,13,38,.8);backdrop-filter:blur(8px);border-left:2px solid rgba(140,180,255,.3);display:flex;flex-direction:column;gap:9px}
#mhead{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
#mhead .ic{font-size:34px}#mhead small{display:block;font-weight:600;opacity:.75;font-size:13px}
#mhead button{margin-left:auto;background:rgba(255,255,255,.12);border-radius:14px;padding:8px 12px;font-size:14px;font-weight:700}
.prow{display:flex;align-items:center;gap:8px}
.prow .lab{width:76px;font-size:14px;font-weight:800;opacity:.9;flex-shrink:0}
.opts{display:flex;gap:7px;flex:1}
.opt{flex:1;min-height:60px;border-radius:16px;background:rgba(255,255,255,.09);border:3px solid transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:12.5px;font-weight:700;gap:1px;padding:4px 2px;transition:transform .1s}
.opt .e{font-size:22px;line-height:1.1}.opt .c{font-size:11px;opacity:.7}
.opt:active{transform:scale(.93)}
.opt.sel{background:rgba(90,150,255,.4);border-color:#8fc1ff;box-shadow:0 0 14px rgba(120,180,255,.5)}
#stats{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px;font-weight:700;margin-top:2px}
.bar{position:relative;height:14px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:#6fb3ff;transition:width .25s,background .25s}
.bar .zone{position:absolute;top:0;bottom:0;background:rgba(120,255,160,.25)}
.bar .line{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff;opacity:.85}
.bar .dot{position:absolute;top:1px;width:12px;height:12px;border-radius:50%;background:#fff;transform:translateX(-50%);transition:left .25s}
#costrow{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:16px}
#costrow small{font-weight:600;opacity:.7;font-size:12.5px}
#launch{margin-top:auto;position:sticky;bottom:0;flex-shrink:0;min-height:66px;border-radius:22px;font-size:26px;font-weight:900;letter-spacing:1px;
  background:linear-gradient(180deg,#ff7a3d,#e2341d);box-shadow:0 6px 0 #8f1d0e,0 0 26px rgba(255,120,60,.5)}
#launch:active{transform:translateY(4px);box-shadow:0 2px 0 #8f1d0e}
@media (max-height:680px){.opt{min-height:48px}.opt .c{display:inline}.opt .e{font-size:19px}#builder{gap:6px}#launch{min-height:54px;font-size:22px}}
@media (max-aspect-ratio:1/1){
  #builder{left:0;right:0;top:auto;bottom:0;width:auto;height:58vh;border-left:0;border-top:2px solid rgba(140,180,255,.3)}
}

/* ── flight hud ── */
#hud{position:fixed;z-index:15;left:12px;right:12px;bottom:14px;display:flex;flex-direction:column;gap:7px;max-width:560px;margin:0 auto;
  background:rgba(8,13,38,.62);backdrop-filter:blur(6px);border-radius:20px;padding:12px 16px;pointer-events:none}
.meter{display:grid;grid-template-columns:120px 1fr 78px;gap:10px;align-items:center;font-size:14px;font-weight:800}
.meter .val{text-align:right;font-variant-numeric:tabular-nums}
.meter .bar{height:16px;overflow:visible}
.meter .bar i{background:linear-gradient(90deg,#57a6ff,#9fe0ff)}
.meter .tick{position:absolute;top:-4px;bottom:-4px;width:3px;background:#ffe36e}
.meter .tick b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;color:#ffe36e;white-space:nowrap}
#status{position:fixed;z-index:15;top:16px;left:50%;transform:translateX(-50%);font-size:clamp(18px,3.4vw,30px);font-weight:900;
  text-shadow:0 2px 8px rgba(0,0,0,.7);text-align:center;pointer-events:none;white-space:nowrap}
#count{position:fixed;z-index:16;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(40vw,40vh);font-weight:900;
  text-shadow:0 0 40px rgba(255,160,60,.9);pointer-events:none}
#ff{position:fixed;z-index:16;top:12px;right:12px;width:60px;height:60px;border-radius:50%;font-size:26px;background:rgba(10,16,40,.6);backdrop-filter:blur(6px)}
#ff.on{background:rgba(90,150,255,.7)}

/* ── result ── */
#result{position:fixed;z-index:25;left:50%;bottom:16px;transform:translateX(-50%);width:min(92vw,470px);border-radius:26px;padding:22px;
  text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
#result.ok{background:linear-gradient(180deg,rgba(40,70,190,.95),rgba(20,30,110,.95));border:3px solid #9fd0ff;box-shadow:0 0 60px rgba(120,190,255,.6)}
#result.ok h2{font-size:34px;text-shadow:0 3px 0 #16307a}
#result.ok .stars{font-size:40px;line-height:1;letter-spacing:6px}
#result.fail{background:rgba(40,42,52,.92);border:2px solid #5a5d6a;padding:16px;gap:8px}
#result.fail h2{font-size:19px;font-weight:700;color:#c9ccd6}
@media (min-aspect-ratio:1/1){#result.ok{left:auto;right:16px;bottom:auto;top:50%;transform:translateY(-50%);width:min(40vw,400px)}}
#result p{font-size:15px;opacity:.9;line-height:1.4}
#result .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#result button{min-height:54px;padding:0 22px;border-radius:18px;font-size:18px;font-weight:800;background:rgba(255,255,255,.16)}
#result.ok button.pri{background:linear-gradient(180deg,#ffd34d,#f59b1c);color:#3a2300;box-shadow:0 5px 0 #a35f07}
#err{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px;background:#05070f}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<a id="home" href="../../index.html" aria-label="Back to Play Zone">🏠</a>

<div id="menu">
  <h1>🚀 Rocket Lab</h1>
  <p>Build a rocket. Launch it. A good design reaches orbit — a bad one comes back down!</p>
  <div id="missions"></div>
</div>

<div id="builder" class="hidden">
  <div id="mhead"><span class="ic" id="mIcon"></span><div><span id="mName"></span><small id="mGoal"></small></div><button id="toMenu">Missions</button></div>
  <div id="rows"></div>
  <div id="stats">
    <span>💪 Push</span><div class="bar"><i id="sPush"></i><div class="line" style="left:33.3%"></div></div>
    <span>⛽ Fuel</span><div class="bar"><i id="sFuel"></i></div>
    <span>🎯 Steady</span><div class="bar"><div class="zone" style="left:34%;width:38%"></div><div class="dot" id="sStab"></div></div>
    <span>💨 Slippery</span><div class="bar"><i id="sSlip"></i></div>
  </div>
  <div id="costrow"><span>🪙 <span id="cost">0</span> coins</span><small id="costHint"></small></div>
  <button id="launch">🚀 LAUNCH!</button>
</div>

<div id="status" class="hidden"></div>
<div id="count" class="hidden"></div>
<button id="ff" class="hidden" aria-label="Fast forward">⏩</button>
<div id="hud" class="hidden">
  <div class="meter"><span>⬆️ Height</span><div class="bar"><i id="hAlt"></i><div class="tick" style="left:70%"><b>SPACE</b></div></div><span class="val" id="vAlt"></span></div>
  <div class="meter" id="rowSpd"><span>➡️ Sideways</span><div class="bar"><i id="hSpd"></i><div class="tick" style="left:87.7%"><b>ORBIT SPEED</b></div></div><span class="val" id="vSpd"></span></div>
  <div class="meter"><span>⛽ Fuel</span><div class="bar"><i id="hFuel" style="background:linear-gradient(90deg,#ffb347,#ffe36e)"></i></div><span class="val" id="vFuel"></span></div>
</div>

<div id="result" class="hidden"></div>

<script>
'use strict';
// ───────── Flight physics (pure, no rendering) ─────────
// Small Kerbin-sized planet so orbit is reachable by a single stage in ~5 sim-minutes.
const R_PLANET = 600000, G0 = 9.81, MU = G0 * R_PLANET * R_PLANET;
const ATM_TOP = 70000, SCALE_H = 6000, RHO0 = 1.2;
const TARGET_AP = 85000;

const PARTS = {
  nose: {
    pointy: { name: 'Pointy', icon: '🔺', cd: 0.25, m: 250, cost: 3 },
    round:  { name: 'Round',  icon: '🔵', cd: 0.70, m: 200, cost: 2 },
    flat:   { name: 'Flat',   icon: '⬛', cd: 4.50, m: 100, cost: 1 },
  },
  body: {
    slim:   { name: 'Slim',   icon: '🥖', r: 0.7, len: 9,  fuel: 9000,  dry: 1000, cost: 4 },
    medium: { name: 'Medium', icon: '🛢️', r: 1.0, len: 11, fuel: 22000, dry: 2200, cost: 7 },
    fat:    { name: 'Fat',    icon: '🐘', r: 1.6, len: 12, fuel: 58000, dry: 5000, cost: 12 },
  },
  fins: {
    none:  { name: 'None',  icon: '🚫', m: 0,    dragA: 0,    stab: -0.6, cost: 0 },
    small: { name: 'Small', icon: '🔹', m: 150,  dragA: 0.08, stab: 0.25, cost: 1 },
    big:   { name: 'Big',   icon: '🔷', m: 400,  dragA: 0.35, stab: 0.8,  cost: 2 },
    giant: { name: 'Giant', icon: '🦋', m: 1200, dragA: 1.6,  stab: 1.8,  cost: 3 },
  },
  engine: {
    small:  { name: 'Small',  icon: '🕯️', F: 170000,  isp: 330, m: 400,  stab: 0,    cost: 3 },
    medium: { name: 'Medium', icon: '🔥', F: 480000,  isp: 310, m: 1200, stab: -0.1, cost: 6 },
    big:    { name: 'Big',    icon: '🌋', F: 1300000, isp: 290, m: 3200, stab: -0.3, cost: 11 },
  },
  boost: {
    b0: { name: 'None', icon: '🚫', n: 0, cost: 0 },
    b2: { name: 'Two',  icon: '✌️', n: 2, cost: 4 },
    b4: { name: 'Four', icon: '🍀', n: 4, cost: 8 },
  },
};
const BOOSTER = { F: 250000, isp: 240, prop: 3700, dry: 800, dragA: 0.16 };

function buildSpec(d, mission) {
  const n = PARTS.nose[d.nose], b = PARTS.body[d.body], f = PARTS.fins[d.fins],
        e = PARTS.engine[d.engine], k = PARTS.boost[d.boost];
  const dry = n.m + b.dry + f.m + e.m + mission.payload;
  const wet = dry + b.fuel + k.n * (BOOSTER.prop + BOOSTER.dry);
  const thrust0 = e.F + k.n * BOOSTER.F;
  return {
    dry, fuel: b.fuel, wet, F: e.F, isp: e.isp, nBoost: k.n,
    cdA: n.cd * Math.PI * b.r * b.r + f.dragA,
    margin: f.stab + e.stab + (d.body === 'fat' ? -0.2 : d.body === 'slim' ? 0.1 : 0),
    twr: thrust0 / (wet * G0),
    dv: e.isp * G0 * Math.log((dry + b.fuel) / dry),
    cost: n.cost + b.cost + f.cost + e.cost + k.cost,
    qLimit: 80000, hop: !!mission.hop,
  };
}

function wrapPi(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function newSim(spec) {
  return {
    spec, t: 0, x: 0, y: 0, vx: 0, vy: 0, th: 0, om: 0,
    fuel: spec.fuel, bProp: spec.nBoost ? BOOSTER.prop : 0, boosters: spec.nBoost,
    phase: 'ascent', engineOn: true, lifted: false, doomed: null, result: null,
    alt: 0, speed: 0, q: 0, ap: 0, pe: -R_PLANET, maxAlt: 0, dragLoss: 0, events: [],
  };
}

function simMass(s) {
  return s.spec.dry + s.fuel + s.boosters * (BOOSTER.dry + s.bProp);
}

function stepSim(s, dt) {
  if (s.result) return;
  const sp = s.spec;
  const rx = s.x, ry = s.y + R_PLANET, rr = Math.hypot(rx, ry);
  const ux = rx / rr, uy = ry / rr, ex = uy, ey = -ux;          // local up / east
  const alt = rr - R_PLANET;
  const v = Math.hypot(s.vx, s.vy);
  const vr = s.vx * ux + s.vy * uy, vh = s.vx * ex + s.vy * ey;
  const rho = alt < ATM_TOP ? RHO0 * Math.exp(-alt / SCALE_H) : 0;
  const q = 0.5 * rho * v * v;
  const upAng = Math.atan2(ux, uy);

  // orbit shape
  const E = v * v / 2 - MU / rr, h = rx * s.vy - ry * s.vx;
  if (E < 0) {
    const a = -MU / (2 * E), ec = Math.sqrt(Math.max(0, 1 + 2 * E * h * h / (MU * MU)));
    s.ap = a * (1 + ec) - R_PLANET; s.pe = a * (1 - ec) - R_PLANET;
  } else { s.ap = Infinity; }

  // ── guidance (autopilot flies every rocket the same way; the design decides the outcome)
  let pitch = 0;
  if (!s.doomed) {
    if (s.phase === 'ascent') {
      if (alt > 600 && v > 50) pitch = (Math.PI / 2) * Math.pow(clamp((alt - 600) / 44000, 0, 1), 0.55);
      if (sp.hop) pitch *= 0.12;
      else if (vr < 0) pitch -= clamp(-vr * 0.01, 0, 0.7);
      if (!sp.hop && s.ap >= TARGET_AP) { s.phase = 'coast'; s.engineOn = false; s.events.push('meco'); }
    } else if (s.phase === 'coast') {
      pitch = Math.PI / 2;
      if (alt > ATM_TOP && vr < 25) { s.phase = 'circ'; s.engineOn = true; s.events.push('circ'); }
      else if (alt < ATM_TOP - 2000 && vr < 0) { s.phase = 'circ'; s.engineOn = true; }
    } else if (s.phase === 'circ') {
      pitch = Math.PI / 2 - clamp(-vr * 0.012, -0.3, 0.6);
      if (s.pe > ATM_TOP + 1500) { s.engineOn = false; s.phase = 'orbit'; s.result = { ok: true, reason: 'orbit' }; }
    }
  }
  if (sp.hop && alt >= ATM_TOP && !s.doomed) s.result = { ok: true, reason: 'space' };
  const target = upAng + pitch;

  // ── forces
  const mainOn = s.engineOn && s.fuel > 0 && !s.doomed;
  const boostOn = s.boosters > 0 && s.bProp > 0 && !s.doomed;
  let F = 0;
  if (mainOn) { F += sp.F; s.fuel = Math.max(0, s.fuel - sp.F / (sp.isp * G0) * dt); }
  if (boostOn) { F += s.boosters * BOOSTER.F; s.bProp = Math.max(0, s.bProp - BOOSTER.F / (BOOSTER.isp * G0) * dt); }
  if (s.boosters > 0 && s.bProp <= 0) { s.boosters = 0; s.events.push('boosterSep'); }
  s.thrusting = F > 0;

  const m = simMass(s);
  const va = v > 5 ? Math.atan2(s.vx, s.vy) : s.th;
  const aoa = wrapPi(s.th - va);
  const cdA = (sp.cdA + s.boosters * BOOSTER.dragA) * (1 + 4 * Math.sin(aoa) * Math.sin(aoa));
  const g = MU / (rr * rr);
  let ax = -g * ux + F * Math.sin(s.th) / m, ay = -g * uy + F * Math.cos(s.th) / m;
  if (v > 0.1) { const D = q * cdA / m; ax -= D * s.vx / v; ay -= D * s.vy / v; s.dragLoss += D * dt; }

  // ── rotation: gimbal/RCS control vs aerodynamic torque (margin<0 ⇒ unstable)
  const auth = s.doomed ? 0 : (F > 0 ? 0.6 : 0.2);
  const ctrl = clamp(5 * wrapPi(target - s.th) - 4 * s.om, -auth, auth);
  const aero = -1.0e-3 * q * sp.margin * Math.sin(aoa) - 2e-5 * q * s.om;
  s.om += (ctrl + aero) * dt; s.th = wrapPi(s.th + s.om * dt);

  s.vx += ax * dt; s.vy += ay * dt;
  if (!s.lifted) {
    if (vr > 0.5 && alt > 0.5) s.lifted = true;
    else if (s.vx * ux + s.vy * uy < 0 || alt <= 0) { if (s.vy < 0) { s.vx = 0; s.vy = 0; } s.th = 0; s.om = 0; }
  }
  s.x += s.vx * dt; s.y += s.vy * dt; s.t += dt;
  s.alt = alt; s.speed = v; s.q = q; s.vr = vr; s.vh = vh; s.aoa = aoa;
  if (alt > s.maxAlt) s.maxAlt = alt;

  // ── failure detection (rocket keeps falling after it's doomed, then hits the ground)
  if (!s.doomed && !s.result) {
    if (!s.lifted && s.t > 4) s.result = { ok: false, reason: 'heavy' };
    else if (q > 2500 && Math.abs(aoa) > 0.8) s.doomed = 'tumble';
    else if (q > sp.qLimit) s.doomed = 'maxq';
    else if (s.fuel <= 0 && s.boosters === 0 && (sp.hop ? s.ap < ATM_TOP : s.pe < ATM_TOP))
      s.doomed = (s.dragLoss > 700 ? 'drag' : sp.margin > 1.2 ? 'steer' : 'fuel');
    else if (s.t > 1500) s.doomed = 'fuel';
    if (s.doomed) { s.engineOn = false; s.doomT = s.t; s.events.push('doomed'); }
  }
  if (((s.lifted && alt <= 0) || (s.doomed && s.t > s.doomT + 500)) && !s.result) s.result = { ok: false, reason: s.doomed || 'fuel' };
}

// ═════════ Game data ═════════
const MISSIONS = [
  { id: 'hop',     icon: '🧸', name: 'Teddy to Space',   goal: 'Fly above the SPACE line',      payload: 500,   hop: true, s3: 10, s2: 14 },
  { id: 'orbit',   icon: '🛰️', name: 'First Orbit',      goal: 'Small satellite · reach orbit', payload: 1000,  s3: 11, s2: 15 },
  { id: 'scope',   icon: '🔭', name: 'Big Telescope',    goal: 'Heavy cargo · reach orbit',     payload: 5000,  s3: 17, s2: 21 },
  { id: 'station', icon: '🏠', name: 'Space Station',    goal: 'Very heavy · reach orbit',      payload: 12000, s3: 28, s2: 32 },
  { id: 'moon',    icon: '🌙', name: 'Moon Ship',        goal: 'Super heavy · reach orbit',     payload: 16000, s3: 32, s2: 35 },
];
const ROWS = [['nose', 'Nose'], ['body', 'Tank'], ['fins', 'Fins'], ['engine', 'Engine'], ['boost', 'Boosters']];
const FAIL_TEXT = {
  heavy:  ["It didn't lift off.", 'Too heavy for that engine.'],
  tumble: ['It flipped over.', 'Not steady enough in the wind.'],
  maxq:   ['It shook apart.', 'Too much push for this rocket in thick air.'],
  drag:   ['The air slowed it down.', 'Its shape is not slippery enough.'],
  steer:  ["It couldn't turn sideways.", 'Those fins fight the steering.'],
  fuel:   ['It ran out of fuel.', 'Not enough fuel for that much weight.'],
};
const SAVE_KEY = 'rocketLab.v1';
let save = { stars: [0, 0, 0, 0, 0], unlocked: 0, design: null };
try { const j = JSON.parse(localStorage.getItem(SAVE_KEY)); if (j && j.stars) save = Object.assign(save, j); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

const $ = id => document.getElementById(id);
let state = 'menu', mission = MISSIONS[0], spec = null, sim = null;
let design = save.design || { nose: 'flat', body: 'slim', fins: 'none', engine: 'small', boost: 'b0' };
let simAcc = 0, after = false, fast = false, mapK = 0, trailT = 0, heavyShown = false;

if (!window.THREE) {
  document.body.insertAdjacentHTML('beforeend', '<div id="err">Could not load the 3D library.<br>Check the internet connection and reload.</div>');
  throw new Error('three.js missing');
}

// ═════════ Audio (procedural) ═════════
let AC = null, engGain = null, engFilt = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const buf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = buf.getChannelData(0);

    b.innerHTML = `<span class="ic">${i > save.unlocked ? '🔒' : m.icon}</span><span class="nm">${m.name}</span><span class="gl">${m.goal}</span><span class="st">${starStr(save.stars[i] || 0)}</span>`;
    b.onclick = () => { audio(); sfxClick(); mission = m; enterBuild(); };
    $('missions').appendChild(b);
  });
}
function renderRows() {
  $('rows').innerHTML = '';
  for (const [key, label] of ROWS) {
    const row = document.createElement('div'); row.className = 'prow';
    row.innerHTML = `<span class="lab">${label}</span>`;
    const opts = document.createElement('div'); opts.className = 'opts';
    for (const id in PARTS[key]) {
      const p = PARTS[key][id], b = document.createElement('button');
      b.className = 'opt' + (design[key] === id ? ' sel' : ''); b.dataset.k = key; b.dataset.id = id;
      b.innerHTML = `<span class="e">${p.icon}</span>${p.name}<span class="c">🪙${p.cost}</span>`;
      b.onclick = () => { audio(); sfxClick(); design[key] = id; save.design = design; persist(); renderRows(); buildRocket(); renderStats(); };
      opts.appendChild(b);
    }
    row.appendChild(opts); $('rows').appendChild(row);
  }
}
function renderStats() {
  spec = buildSpec(design, mission);
  const push = clamp(spec.twr / 3, 0, 1);
  $('sPush').style.width = push * 100 + '%'; $('sPush').style.background = spec.twr < 1 ? '#8b8f9c' : '#6fb3ff';
  $('sFuel').style.width = clamp(spec.dv / 6500, 0, 1) * 100 + '%';
  $('sStab').style.left = clamp((spec.margin + 1) / 3.2, 0.03, 0.97) * 100 + '%';
  $('sSlip').style.width = clamp(1 - Math.sqrt((spec.cdA + spec.nBoost * BOOSTER.dragA) / 40), 0.04, 1) * 100 + '%';
  $('cost').textContent = spec.cost;
  $('costHint').textContent = `★★★ needs ${mission.s3} coins or less`;
}
function enterMenu() { state = 'menu'; resetPad(); renderMenu(); show('menu', true); show('builder', false); hideFlightUI(); }
function enterBuild() {
  state = 'build'; resetPad();
  $('mIcon').textContent = mission.icon; $('mName').textContent = mission.name; $('mGoal').textContent = mission.goal + ' · cargo ' + (mission.payload / 1000) + ' t';
  renderRows(); renderStats(); show('menu', false); show('builder', true); hideFlightUI();
}
function hideFlightUI() { show('hud', false); show('status', false); show('ff', false); show('result', false); show('count', false); stopConfetti(); setEngineSound(0, 1); }
function resetPad() {
  sim = null; after = false; mapK = 0; simAcc = 0; trailN = 0; trailGeo.setDrawRange(0, 0); orbitLine.visible = false; followPivot.visible = false;
  world.position.set(0, 0, 0); rocket.rotation.set(0, 0, 0); autoSpin = true;
  for (const p of smoke) p.s.visible = false;
  buildRocket();
}
$('toMenu').onclick = () => { sfxClick(); enterMenu(); };
$('launch').onclick = startCountdown;
$('ff').onclick = () => { fast = !fast; $('ff').classList.toggle('on', fast); };
addEventListener('keydown', e => { if (e.code === 'Space' && state === 'build') { e.preventDefault(); startCountdown(); } });

// ═════════ Flight ═════════
function startCountdown() {
  if (state !== 'build') return;
  audio(); state = 'countdown'; show('builder', false); show('count', true);
  let n = 3; const tick = () => {
    if (state !== 'countdown') return;
    if (n > 0) { $('count').textContent = n; tone(440, 0.15, 'square', 0.1); n--; setTimeout(tick, 750); }
    else { tone(880, 0.4, 'square', 0.12); show('count', false); liftoff(); }
  }; tick();
}
function liftoff() {
  spec = buildSpec(design, mission); sim = newSim(spec); state = 'flight'; after = false; simAcc = 0; trailT = 0; heavyShown = false;
  fast = false; $('ff').classList.remove('on');
  show('hud', true); show('status', true); show('ff', true); show('rowSpd', !mission.hop);
  setStatus('Liftoff!');
}
function setStatus(t) { $('status').textContent = t; }
function coastStep(s, dt) {   // gravity-only propagation once the mission result is known
  const rx = s.x, ry = s.y + R_PLANET, rr = Math.hypot(rx, ry), g = MU / (rr * rr * rr);
  s.vx -= g * rx * dt; s.vy -= g * ry * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.alt = rr - R_PLANET; s.speed = Math.hypot(s.vx, s.vy);
  const va = Math.atan2(s.vx, s.vy); s.th += wrapPi(va - s.th) * Math.min(1, dt * 0.5); s.thrusting = false;
}
function updateFlight(dt) {
  let warp;
  if (after) warp = mission.hop ? 1 : 70;
  else if (sim.doomed) warp = sim.alt < 4000 ? 3 : 12;
  else if (sim.phase === 'coast') warp = 30;
  else warp = sim.t < 5 ? 1.5 : Math.min(6, 1.5 + (sim.t - 5) * 0.6);
  if (fast && !after) warp *= 2.5;
  simAcc += dt * warp;
  const px = sim.x, py = sim.y; let steps = 0;
  while (steps++ < 800) {
    const h = (sim.thrusting !== false && !after) || sim.alt < ATM_TOP ? 0.02 : 0.1;
    if (simAcc < h) break; simAcc -= h;
    if (after) { if (!(mission.hop && sim.alt < 62000 && sim.vy < 0)) coastStep(sim, h); }
    else { stepSim(sim, h); if (sim.result) { onResult(); break; } }
  }
  if (steps >= 800) simAcc = 0;
  for (const ev of sim.events.splice(0)) {
    if (ev === 'boosterSep') { rk.boosters.forEach(b => { b.userData.sep = true; b.userData.flame.visible = false; }); tone(180, 0.12, 'square', 0.06); }
    else if (ev === 'meco') setStatus('Engine off — coasting up…');
    else if (ev === 'circ') setStatus('Now speed up sideways!');
    else if (ev === 'doomed') setStatus('');
  }
  if (!after && !sim.doomed && sim.phase === 'ascent' && sim.alt > 700 && !mission.hop && $('status').textContent === 'Liftoff!') setStatus('Tilting sideways…');

  world.position.set(-sim.x, -sim.y, 0); rocket.rotation.z = -sim.th;
  // trail
  trailT += dt * warp;
  if (trailT > (after ? 8 : 1) && trailN < TRAIL_MAX) { trailT = 0; trailPos.set([sim.x, sim.y, 0], trailN * 3); trailN++; trailGeo.setDrawRange(0, trailN); trailGeo.attributes.position.needsUpdate = true; }
  // ground under far-away landings
  const downrange = Math.atan2(sim.x, sim.y + R_PLANET);
  followPivot.visible = Math.abs(downrange) > 0.05 && sim.alt < 30000;
  if (followPivot.visible) {
    followPivot.rotation.z = -downrange;
    const phi = Math.atan2(-Math.cos(downrange), -Math.sin(downrange)), u = ((phi / (2 * Math.PI)) % 1 + 1) % 1;
    const px4 = pctx.getImageData(Math.floor(u * TW) % TW, TH / 2, 1, 1).data; followMat.color.setRGB(px4[0] / 255, px4[1] / 255, px4[2] / 255).convertSRGBToLinear();
  }
  // flames, smoke, sound
  const air = clamp(Math.exp(-sim.alt / 9000), 0, 1), on = !!sim.thrusting && !after;
  const flick = 0.85 + Math.random() * 0.3;
  rk.flames[0].visible = on && sim.fuel > 0 && sim.engineOn;
  rk.flames[0].scale.set(rk.nozzleR * (1 + 2.2 * (1 - air)), rk.nozzleR * 7 * flick, rk.nozzleR * (1 + 2.2 * (1 - air)));
  rk.flames[0].children[0].material.opacity = 0.35 + 0.4 * air;
  for (const b of rk.boosters) { const fl = b.userData.flame; fl.visible = on && !b.userData.sep && sim.boosters > 0; fl.scale.set(0.36 * (1 + 2 * (1 - air)), 3.2 * flick, 0.36 * (1 + 2 * (1 - air))); }
  if (on && air > 0.03) {
    const sn = Math.sin(sim.th), cs = Math.cos(sim.th), n = sim.alt < 3000 ? 3 : 2;
    for (let i = 0; i < n; i++) {
      const f = Math.random(), bx = px + (sim.x - px) * f + sn * rk.nozzleY, by = py + (sim.y - py) * f + cs * rk.nozzleY;
      spawnSmoke(bx, by, (Math.random() - 0.5), -sn * 30 + (Math.random() - 0.5) * 10, -cs * 30 + (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10,
        (2.5 + rk.nozzleR * 4) * (1 + sim.alt / 8000), 1.6 + Math.random() * 0.8);
    }
  }
  setEngineSound(on ? 1 : 0, air);
  // hud
  const km = sim.alt / 1000;
  $('hAlt').style.width = clamp(km / 100, 0, 1) * 100 + '%'; $('vAlt').textContent = km.toFixed(km < 10 ? 1 : 0) + ' km';
  const vh = Math.abs(sim.vh || 0); $('hSpd').style.width = clamp(vh / 2600, 0, 1) * 100 + '%'; $('vSpd').textContent = Math.round(vh) + ' m/s';
  const ff = sim.fuel / spec.fuel; $('hFuel').style.width = ff * 100 + '%'; $('vFuel').textContent = Math.round(ff * 100) + '%';
  if (after && !mission.hop) { mapK = Math.min(1, mapK + dt / 5); }
}
function drawOrbit() {
  const rx = sim.x, ry = sim.y + R_PLANET, rr = Math.hypot(rx, ry), v2 = sim.vx * sim.vx + sim.vy * sim.vy, rv = rx * sim.vx + ry * sim.vy;
  const ex = ((v2 - MU / rr) * rx - rv * sim.vx) / MU, ey = ((v2 - MU / rr) * ry - rv * sim.vy) / MU, e = Math.hypot(ex, ey);
  const a = -MU / (2 * (v2 / 2 - MU / rr)), w = Math.atan2(ey, ex), arr = orbitGeo.attributes.position.array;
  for (let i = 0; i <= 256; i++) { const nu = i / 256 * Math.PI * 2, rad = a * (1 - e * e) / (1 + e * Math.cos(nu)); arr.set([rad * Math.cos(w + nu), rad * Math.sin(w + nu) - R_PLANET, 0], i * 3); }
  orbitGeo.attributes.position.needsUpdate = true; orbitLine.visible = true;
}
function onResult() {
  const res = sim.result, el = $('result'); show('ff', false);
  if (res.ok) {
    after = true; const i = MISSIONS.indexOf(mission), stars = spec.cost <= mission.s3 ? 3 : spec.cost <= mission.s2 ? 2 : 1;
    save.stars[i] = Math.max(save.stars[i] || 0, stars); save.unlocked = Math.max(save.unlocked, Math.min(MISSIONS.length - 1, i + 1)); persist();
    if (!mission.hop) drawOrbit();
    setStatus(mission.hop ? '' : 'Going round and round the planet!');
    sfxFanfare(); startConfetti();
    const next = MISSIONS[i + 1];
    el.className = 'ok';
    el.innerHTML = `<h2>${mission.hop ? '🌌 SPACE!' : '🛰️ ORBIT!'}</h2><div class="stars">${starStr(stars)}</div>
      <p>${mission.icon} ${mission.name} — done with a ${spec.cost}-coin rocket.${stars < 3 ? `<br>Can you do it with ${mission.s3} coins or less?` : '<br>Perfect design!'}</p>
      <div class="btns">${next ? '<button class="pri" id="rNext">Next mission ▶</button>' : ''}<button id="rAgain">Build again</button><button id="rMenu">Missions</button></div>`;
    setTimeout(() => { if (state === 'flight' && after) { show('result', true); show('hud', false); } }, mission.hop ? 900 : 3800);
    if (next) $('rNext').onclick = () => { sfxClick(); mission = next; enterBuild(); };
  } else {
    // failure is deliberately plain: one grey card, one dull sound, no spectacle
    state = 'result'; sfxDull(); setStatus(''); setEngineSound(0, 1);
    for (const f of rk.flames) f.visible = false; rk.boosters.forEach(b => b.userData.flame.visible = false);
    if (res.reason !== 'heavy') for (let i = 0; i < 4; i++) spawnSmoke(sim.x + (Math.random() - 0.5) * 6, sim.y, (Math.random() - 0.5) * 6, 0, 3, 0, 6, 1.5, true);
    const t = FAIL_TEXT[res.reason] || FAIL_TEXT.fuel, top = Math.round(sim.maxAlt / 1000);
    el.className = 'fail';
    el.innerHTML = `<h2>${t[0]} ${t[1]}</h2><p>Highest: ${top} km${mission.hop ? ' of 70' : ` · Orbit speed: ${Math.round(clamp((sim.maxVh || 0) / 2280, 0, 1) * 100)}%`}</p>
      <div class="btns"><button id="rAgain">Change the rocket</button></div>`;
    show('result', true); show('hud', false);
  }
  $('rAgain').onclick = () => { sfxClick(); enterBuild(); };
  if ($('rMenu')) $('rMenu').onclick = () => { sfxClick(); enterMenu(); };
}
function updateBoosters(dt) {
  for (const b of rk.boosters) {
    if (!b.userData.sep || !b.visible) continue;
    const u = b.userData; u.t += dt;
    b.position.x += Math.cos(u.ang) * 5 * dt; b.position.z += Math.sin(u.ang) * 5 * dt; b.position.y -= (6 + 30 * u.t) * dt;
    b.rotation.z += Math.cos(u.ang) * -0.5 * dt; b.rotation.x += Math.sin(u.ang) * 0.5 * dt;
    if (u.t > 3.5) b.visible = false;
  }
}

// ═════════ Confetti (success only) ═════════
let conf = [], confOn = false;
function startConfetti() {
  confOn = true; conf = [];
  for (let i = 0; i < 160; i++) conf.push({ x: Math.random() * innerWidth, y: -Math.random() * innerHeight, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 180, r: 5 + Math.random() * 7, a: Math.random() * 6, c: `hsl(${Math.random() * 360},90%,65%)` });
}
function stopConfetti() { confOn = false; conf = []; const c = $('fx'); c.getContext('2d').clearRect(0, 0, c.width, c.height); }
function updateConfetti(dt) {
  if (!confOn) return; const c = $('fx'), x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height);
  for (const p of conf) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.a += dt * 5; if (p.y > c.height + 20) { p.y = -20; p.x = Math.random() * c.width; }
    x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r, -p.r * 0.4, p.r * 2, p.r * 0.8); x.restore();
  }
}

// ═════════ Main loop ═════════
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (sim && (state === 'flight')) {
    if (sim.vh > (sim.maxVh || 0)) sim.maxVh = sim.vh;
    updateFlight(dt);
  }
  updateBoosters(dt); updateSmoke(dt); updateCamera(dt); updateSky(); updateConfetti(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.__rocketLab = { get sim() { return sim; }, get state() { return state; }, setDesign(d) { Object.assign(design, d); renderRows(); buildRocket(); renderStats(); } };
enterMenu();
requestAnimationFrame(frame);
</script>
