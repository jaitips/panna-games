<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jump Ball — Play Zone</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a1640">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Play Zone">
<link rel="apple-touch-icon" href="/shared/apple-touch-icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0820;font-family:'Fredoka',sans-serif;color:#fff;touch-action:none}
#wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
canvas{display:block;background:linear-gradient(180deg,#1a1640 0%,#2a2270 50%,#1a1640 100%)}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);pointer-events:none}
#hud .scoreP{font-size:1.4rem;font-weight:700;color:#5fe0ff;text-shadow:0 2px 6px rgba(0,0,0,.5)}
#hud .scoreR{font-size:1.4rem;font-weight:700;color:#ff5f8b;text-shadow:0 2px 6px rgba(0,0,0,.5)}
#hud .title{font-size:1rem;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:2px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
#cam{position:absolute;bottom:10px;left:10px;width:120px;height:90px;border-radius:10px;border:2px solid rgba(255,255,255,.25);z-index:20;transform:scaleX(-1);object-fit:cover;opacity:.75}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;background:rgba(10,8,32,.94);text-align:center;padding:2rem;transition:opacity .3s}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:2.8rem;margin-bottom:.4rem;color:#5fe0ff;text-shadow:0 2px 12px rgba(80,200,255,.4)}
#overlay h2{font-size:1.8rem;margin-bottom:.8rem;color:#ffe860}
#overlay p{font-size:1.05rem;color:rgba(255,255,255,.75);margin-bottom:1.2rem;max-width:420px;line-height:1.6}
.btn{display:inline-block;padding:.7rem 2.2rem;border-radius:2rem;background:#5fe0ff;color:#0a0820;font-weight:700;font-size:1.1rem;border:none;cursor:pointer;font-family:inherit;margin:.4rem;text-decoration:none}
.btn:hover{background:#3fc4e8}
.btn-back{background:rgba(255,255,255,.13);color:#fff}
.btn-back:hover{background:rgba(255,255,255,.22)}
#calibBar{width:200px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);margin:1rem auto;overflow:hidden}
#calibFill{height:100%;background:#5fe0ff;border-radius:4px;width:0%;transition:width .3s}
.icon{font-size:5rem;margin:.5rem 0;display:block}
#__hubBack{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 8px);z-index:99999;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1;font-weight:700;text-decoration:none;border:2px solid rgba(255,255,255,.45);box-shadow:0 2px 8px rgba(0,0,0,.35);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#__hubBack:active{background:rgba(0,0,0,.8);transform:scale(.92)}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud" style="display:none">
    <div class="scoreR" id="scoreREl">🤖 0</div>
    <div class="title">Jump Ball</div>
    <div class="scoreP" id="scorePEl">0 😀</div>
  </div>
  <canvas id="game"></canvas>
  <video id="cam" playsinline autoplay muted></video>
  <div id="overlay">
    <span class="icon">🏓</span>
    <h1>Jump Ball</h1>
    <p>Lean LEFT and RIGHT to slide your paddle.<br>
    Bounce the ball past the robot drone!<br>
    First to 5 wins. 🤖 vs 😀</p>
    <button class="btn" id="btnStart">Camera Mode</button>
    <button class="btn" id="btnKB" style="background:#ffe860;color:#0a0820">Keyboard Mode</button><br>
    <a class="btn btn-back" href="../../index.html">← Back</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script>
<script>
(function(){
"use strict";

/* CONSTANTS */
const WIN_SCORE=5;
const PADDLE_HFRAC=0.13;        // paddle width fraction of canvas width
const PADDLE_THICK=18;
const PADDLE_Y_PAD=46;
const BALL_R=18;
const BALL_SPD_START=380;       // px/sec
const BALL_SPD_INC=22;          // each hit
const BALL_SPD_MAX=900;
const BOT_REACT=0.55;           // 0..1 — slower = weaker
const BOT_MAX_SPD_FRAC=0.45;    // bot max speed as fraction of canvas width per second
const SERVE_DELAY=900;
const LERP_A=0.45;
const LEAN_SENS=2.6;            // multiplier on shoulder offset → paddle x

/* DOM */
const cvs=document.getElementById('game');
const X=cvs.getContext('2d');
const vid=document.getElementById('cam');
const olay=document.getElementById('overlay');
const hudEl=document.getElementById('hud');
const scorePEl=document.getElementById('scorePEl');
const scoreREl=document.getElementById('scoreREl');

/* STATE */
let W=0,H=0;
let state='TITLE',stT=0,cdNum=3;
let scoreP=0, scoreR=0;
let player={x:0,y:0,w:0,h:PADDLE_THICK,vx:0};
let robot={x:0,y:0,w:0,h:PADDLE_THICK,vx:0};
let ball={x:0,y:0,vx:0,vy:0,trail:[],spd:BALL_SPD_START};
let serveT=0;
let serveTo='player'; // who is about to lose serve
let trailParticles=[];
let stars=[];
let lastWinner=null;

/* INPUT */
let kbMode=false;
let kbLeft=false,kbRight=false;
let smX=0.5, bX=0.5; // shoulder midpoint smoothed + baseline
let calibBuf=[];
let poseModel=null,poseBusy=false,poseOK=false;

/* AUDIO */
let ac=null;
function aInit(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)()}
function tone(f,d,t,v){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=t||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
function sBlip(){tone(620,.06,'square',.08)}
function sHitP(){tone(480,.07,'square',.1);setTimeout(()=>tone(720,.07,'square',.08),40)}
function sHitR(){tone(380,.07,'square',.1);setTimeout(()=>tone(260,.07,'square',.08),40)}
function sScoreP(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.1,'square',.1),i*80))}
function sScoreR(){[440,330,220].forEach((f,i)=>setTimeout(()=>tone(f,.14,'sawtooth',.1),i*100))}
function sCD(){tone(440,.12,'square',.08)}
function sGo(){tone(523,.1);setTimeout(()=>tone(784,.16),110)}
function sWin(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.18,'square',.12),i*120))}
function sLose(){[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.22,'sawtooth',.1),i*150))}

/* MEDIAPIPE POSE */
async function setupCam(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240}}});
    vid.srcObject=s;await new Promise(r=>vid.onloadedmetadata=r);vid.play();return true;
  }catch(e){console.warn('No camera:',e);return false}
}
function setupPose(){
  poseModel=new window.Pose({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${f}`});
  poseModel.setOptions({modelComplexity:0,smoothLandmarks:true,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
  poseModel.onResults(onPose);
}
function onPose(res){
  if(!res.poseLandmarks)return;
  poseOK=true;
  const ls=res.poseLandmarks[11], rs=res.poseLandmarks[12];
  if(!ls||!rs)return;
  const rx=(ls.x+rs.x)/2;
  smX+=LERP_A*(rx-smX);
  if(state==='CALIBRATING')calibBuf.push(smX);
}
async function sendFrame(){
  if(!poseBusy&&poseModel&&vid.readyState>=2){
    poseBusy=true;
    try{await poseModel.send({image:vid})}catch(e){}
    poseBusy=false;
  }
  requestAnimationFrame(sendFrame);
}

/* KEYBOARD */
window.addEventListener('keydown',e=>{
  aInit();
  if(e.key==='ArrowLeft'||e.key==='a'){kbLeft=true}
  if(e.key==='ArrowRight'||e.key==='d'){kbRight=true}
  if(e.key===' '&&state==='TITLE'){beginKB()}
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'){kbLeft=false}
  if(e.key==='ArrowRight'||e.key==='d'){kbRight=false}
});

/* RESIZE */
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  cvs.width=W;cvs.height=H;
  player.w=Math.max(80,W*PADDLE_HFRAC);
  robot.w=Math.max(80,W*PADDLE_HFRAC);
  player.y=H-PADDLE_Y_PAD-PADDLE_THICK;
  robot.y=PADDLE_Y_PAD;
  if(state==='TITLE'){
    player.x=(W-player.w)/2;
    robot.x=(W-robot.w)/2;
    ball.x=W/2;ball.y=H/2;
  }
  // build star field once on resize
  stars=[];
  for(let i=0;i<70;i++){
    stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,tw:Math.random()*Math.PI*2});
  }
}

/* GAME LOGIC */
function resetMatch(){
  scoreP=0;scoreR=0;
  player.x=(W-player.w)/2;
  robot.x=(W-robot.w)/2;
  serveTo=Math.random()<0.5?'player':'robot';
  serveBall(serveTo);
}
function serveBall(toward){
  ball.x=W/2;ball.y=H/2;
  ball.spd=BALL_SPD_START;
  ball.trail=[];
  // pick a serve angle. -45..45 deg, then point toward 'toward' side
  const ang=(Math.random()*0.7-0.35);
  const dirY=toward==='player'?1:-1;
  ball.vx=Math.sin(ang)*ball.spd;
  ball.vy=Math.cos(ang)*ball.spd*dirY;
  serveT=SERVE_DELAY;
}

function updPlayer(dt){
  let target=player.x;
  if(kbMode){
    const sp=W*0.95*dt; // fast keyboard
    if(kbLeft) target-=sp;
    if(kbRight) target+=sp;
  } else {
    // shoulder offset around baseline → paddle x in [0..1]
    const off=(smX-bX)*LEAN_SENS;
    // mirrored: leaning your body left moves paddle left
    const t=Math.max(0,Math.min(1,0.5-off));
    target=t*(W-player.w);
  }
  // clamp + smooth
  target=Math.max(0,Math.min(W-player.w,target));
  player.vx=(target-player.x)*0.5;
  player.x+=player.vx;
}

function updRobot(dt){
  // bot follows ball x with capped speed and reaction lag
  if(ball.vy>=0){
    // ball moving away from robot — drift to center
    const targetCenter=(W-robot.w)/2;
    const maxStep=W*BOT_MAX_SPD_FRAC*dt*0.5;
    const dx=targetCenter-robot.x;
    robot.x+=Math.max(-maxStep,Math.min(maxStep,dx*0.5));
  } else {
    const targetX=ball.x-robot.w/2;
    const maxStep=W*BOT_MAX_SPD_FRAC*dt;
    const dx=(targetX-robot.x)*BOT_REACT;
    robot.x+=Math.max(-maxStep,Math.min(maxStep,dx));
  }
  robot.x=Math.max(0,Math.min(W-robot.w,robot.x));
}

function bounceOffPaddle(p,fromBottom){
  // collide rect (paddle) with ball
  const closestX=Math.max(p.x,Math.min(ball.x,p.x+p.w));
  const closestY=Math.max(p.y,Math.min(ball.y,p.y+p.h));
  const dx=ball.x-closestX, dy=ball.y-closestY;
  const dist=Math.hypot(dx,dy);
  if(dist>BALL_R)return false;

  // angle based on hit position along paddle
  const hit=(ball.x-(p.x+p.w/2))/(p.w/2); // -1..1
  const maxAng=0.85; // radians
  const ang=Math.max(-maxAng,Math.min(maxAng,hit*maxAng));
  ball.spd=Math.min(BALL_SPD_MAX,ball.spd+BALL_SPD_INC);
  const dirY=fromBottom?-1:1;
  ball.vx=Math.sin(ang)*ball.spd;
  ball.vy=Math.cos(ang)*ball.spd*dirY;
  // push ball out of paddle so it can't tunnel
  ball.y=fromBottom?p.y-BALL_R-1:p.y+p.h+BALL_R+1;
  // small particle puff
  for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2;
    trailParticles.push({x:ball.x,y:ball.y,vx:Math.cos(a)*120,vy:Math.sin(a)*120,life:280,age:0,color:fromBottom?'#5fe0ff':'#ff5f8b',size:3+Math.random()*3});
  }
  return true;
}

function updBall(dt){
  if(serveT>0){serveT-=dt*1000;if(serveT>0)return}
  ball.trail.push({x:ball.x,y:ball.y});
  if(ball.trail.length>10)ball.trail.shift();
  ball.x+=ball.vx*dt;
  ball.y+=ball.vy*dt;
  // walls
  if(ball.x<BALL_R){ball.x=BALL_R;ball.vx=Math.abs(ball.vx);sBlip()}
  if(ball.x>W-BALL_R){ball.x=W-BALL_R;ball.vx=-Math.abs(ball.vx);sBlip()}
  // paddle collisions
  if(ball.vy>0&&ball.y+BALL_R>=player.y){
    if(bounceOffPaddle(player,true))sHitP();
  } else if(ball.vy<0&&ball.y-BALL_R<=robot.y+robot.h){
    if(bounceOffPaddle(robot,false))sHitR();
  }
  // out of play
  if(ball.y>H+40){
    scoreR++;sScoreR();
    if(scoreR>=WIN_SCORE){lastWinner='robot';finishMatch();return}
    serveBall('player'); // serve toward loser
  } else if(ball.y<-40){
    scoreP++;sScoreP();
    if(scoreP>=WIN_SCORE){lastWinner='player';finishMatch();return}
    serveBall('robot');
  }
}

function updParticles(dt){
  for(let i=trailParticles.length-1;i>=0;i--){
    const p=trailParticles[i];
    p.age+=dt*1000;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=0.92;p.vy*=0.92;
    if(p.age>=p.life)trailParticles.splice(i,1);
  }
}

function finishMatch(){
  state='MATCHEND';
  if(lastWinner==='player')sWin();else sLose();
  const win=lastWinner==='player';
  showOL(`<span class="icon">${win?'🏆':'🤖'}</span>
    <h1>${win?'You Win!':'Robot Wins!'}</h1>
    <h2>${scoreP} — ${scoreR}</h2>
    <p>${win?'Patan-level reflexes! 🎉':'So close — try again!'}</p>
    <button class="btn" onclick="window._restart()">Camera Mode</button>
    <button class="btn" style="background:#ffe860;color:#0a0820" onclick="window._restartKB()">Keyboard Mode</button><br>
    <a class="btn btn-back" href="../../index.html">← Back</a>`);
}

/* RENDERING */
function drawStars(){
  X.save();
  for(const s of stars){
    s.tw+=0.04;
    const a=0.4+Math.sin(s.tw)*0.3;
    X.globalAlpha=a;
    X.fillStyle='#fff';
    X.beginPath();X.arc(s.x,s.y,s.r,0,Math.PI*2);X.fill();
  }
  X.restore();
}

function drawCourt(){
  // center line
  X.save();
  X.setLineDash([14,12]);X.strokeStyle='rgba(255,255,255,.25)';X.lineWidth=2;
  X.beginPath();X.moveTo(0,H/2);X.lineTo(W,H/2);X.stroke();
  X.setLineDash([]);
  // side rails glow
  X.strokeStyle='rgba(120,180,255,.18)';X.lineWidth=4;
  X.beginPath();X.moveTo(2,0);X.lineTo(2,H);X.moveTo(W-2,0);X.lineTo(W-2,H);X.stroke();
  X.restore();
}

function drawRobotPaddle(){
  const p=robot;
  X.save();
  // glow
  X.shadowColor='#ff5f8b';X.shadowBlur=18;
  X.fillStyle='#ff5f8b';
  rrect(p.x,p.y,p.w,p.h,p.h/2);X.fill();
  X.shadowBlur=0;
  // metallic stripe
  X.fillStyle='rgba(255,255,255,.25)';
  rrect(p.x+8,p.y+3,p.w-16,4,2);X.fill();
  // robot face on paddle (eye in middle)
  X.fillStyle='#0a0820';
  X.beginPath();X.arc(p.x+p.w/2,p.y+p.h/2,5,0,Math.PI*2);X.fill();
  X.fillStyle='#ff5f8b';
  X.beginPath();X.arc(p.x+p.w/2-1,p.y+p.h/2-1,1.6,0,Math.PI*2);X.fill();
  X.restore();
}

function drawPlayerPaddle(){
  const p=player;
  X.save();
  X.shadowColor='#5fe0ff';X.shadowBlur=18;
  X.fillStyle='#5fe0ff';
  rrect(p.x,p.y,p.w,p.h,p.h/2);X.fill();
  X.shadowBlur=0;
  X.fillStyle='rgba(255,255,255,.3)';
  rrect(p.x+8,p.y+p.h-7,p.w-16,4,2);X.fill();
  // smiley center
  X.fillStyle='#0a0820';
  X.beginPath();X.arc(p.x+p.w/2-7,p.y+p.h/2,2.2,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(p.x+p.w/2+7,p.y+p.h/2,2.2,0,Math.PI*2);X.fill();
  X.strokeStyle='#0a0820';X.lineWidth=1.6;X.lineCap='round';
  X.beginPath();X.arc(p.x+p.w/2,p.y+p.h/2+1,5,0.1*Math.PI,0.9*Math.PI);X.stroke();
  X.restore();
}

function rrect(x,y,w,h,r){
  X.beginPath();
  X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);
  X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);
  X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath();
}

function drawBall(){
  // trail
  X.save();
  for(let i=0;i<ball.trail.length;i++){
    const t=ball.trail[i];
    const a=(i+1)/ball.trail.length*0.4;
    X.globalAlpha=a;
    X.fillStyle='#ffe860';
    X.beginPath();X.arc(t.x,t.y,BALL_R*(0.5+i*0.05),0,Math.PI*2);X.fill();
  }
  X.restore();
  // ball
  X.save();
  X.shadowColor='#ffe860';X.shadowBlur=20;
  const g=X.createRadialGradient(ball.x-5,ball.y-5,2,ball.x,ball.y,BALL_R);
  g.addColorStop(0,'#ffffff');
  g.addColorStop(0.4,'#ffe860');
  g.addColorStop(1,'#dcae00');
  X.fillStyle=g;
  X.beginPath();X.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);X.fill();
  X.shadowBlur=0;
  // sheen
  X.fillStyle='rgba(255,255,255,.7)';
  X.beginPath();X.arc(ball.x-6,ball.y-7,4,0,Math.PI*2);X.fill();
  X.restore();
}

function drawParticles(){
  X.save();
  for(const p of trailParticles){
    const a=1-p.age/p.life;
    X.globalAlpha=a;
    X.fillStyle=p.color;
    X.beginPath();X.arc(p.x,p.y,p.size,0,Math.PI*2);X.fill();
  }
  X.restore();
}

function drawServeIndicator(){
  if(serveT<=0)return;
  X.save();
  X.fillStyle='rgba(255,255,255,.8)';
  X.font='bold 28px Fredoka, sans-serif';
  X.textAlign='center';
  X.fillText('Get ready!',W/2,H/2-40);
  X.restore();
}

function drawBigScore(){
  X.save();
  X.font='bold 120px Fredoka, sans-serif';
  X.textAlign='center';
  X.globalAlpha=0.08;
  X.fillStyle='#ff5f8b';X.fillText(scoreR,W/2,H*0.35);
  X.fillStyle='#5fe0ff';X.fillText(scoreP,W/2,H*0.78);
  X.restore();
}

function render(){
  X.clearRect(0,0,W,H);
  drawStars();
  drawCourt();
  drawBigScore();
  drawRobotPaddle();
  drawPlayerPaddle();
  drawBall();
  drawParticles();
  if(state==='PLAYING')drawServeIndicator();
}

/* GAME STATES */
function showOL(h){olay.innerHTML=h;olay.classList.remove('hidden')}
function hideOL(){olay.classList.add('hidden')}

function beginCalib(){
  aInit();state='CALIBRATING';calibBuf=[];stT=2800;
  kbMode=false;
  vid.style.display='';
  showOL(`<span class="icon">🧍</span>
    <h2>Stand still!</h2>
    <p>Stand in the center so we can find your shoulders.</p>
    <div id="calibBar"><div id="calibFill"></div></div>`);
}
function beginKB(){
  aInit();kbMode=true;
  vid.style.display='none';
  startCD();
}
function finishCalib(){
  if(calibBuf.length>10){
    let s=0;for(const v of calibBuf)s+=v;
    bX=s/calibBuf.length;
  } else bX=0.5;
  startCD();
}
function startCD(){
  state='COUNTDOWN';cdNum=3;stT=3000;
  resetMatch();
  hudEl.style.display='flex';
  showOL(`<div id="cdTxt" style="font-size:6rem;font-weight:700;color:#5fe0ff;text-shadow:0 0 30px rgba(80,200,255,.4)">3</div>`);
  sCD();
}
function startPlay(){state='PLAYING';hideOL();sGo()}

window._restart=beginCalib;
window._restartKB=beginKB;

/* MAIN LOOP */
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,0.05);lastT=ts;

  switch(state){
  case'TITLE':
    render();break;

  case'CALIBRATING':
    stT-=dt*1000;
    const cf=document.getElementById('calibFill');
    if(cf)cf.style.width=Math.min(100,((2800-stT)/2800)*100)+'%';
    if(stT<=0)finishCalib();
    render();break;

  case'COUNTDOWN':
    stT-=dt*1000;
    const nn=Math.ceil(stT/1000);
    if(nn!==cdNum&&nn>0){cdNum=nn;sCD()}
    const cdE=document.getElementById('cdTxt');
    if(cdE)cdE.textContent=stT<=0?'GO!':Math.ceil(stT/1000);
    if(stT<=-400)startPlay();
    updPlayer(dt);updRobot(dt);updParticles(dt);
    render();break;

  case'PLAYING':{
    updPlayer(dt);
    updRobot(dt);
    updBall(dt);
    updParticles(dt);
    scorePEl.textContent=scoreP+' 😀';
    scoreREl.textContent='🤖 '+scoreR;
    render();break;
  }

  case'MATCHEND':
    updParticles(dt);
    render();break;
  }
  requestAnimationFrame(loop);
}

/* INIT */
async function init(){
  resize();window.addEventListener('resize',resize);
  player.x=(W-player.w)/2;
  robot.x=(W-robot.w)/2;
  ball.x=W/2;ball.y=H/2;
  render();

  const hasCam=await setupCam();
  if(hasCam){setupPose();sendFrame()}
  else{vid.style.display='none'}

  document.getElementById('btnStart').addEventListener('click',()=>{aInit();beginCalib()});
  document.getElementById('btnKB').addEventListener('click',()=>{aInit();beginKB()});
  // touch drag fallback
  cvs.addEventListener('touchmove',e=>{
    if(state!=='PLAYING'&&state!=='COUNTDOWN')return;
    if(!kbMode)return; // only apply in keyboard/touch mode
    const t=e.touches[0];if(!t)return;
    const tx=t.clientX-player.w/2;
    player.x=Math.max(0,Math.min(W-player.w,tx));
  },{passive:true});
  requestAnimationFrame(loop);
}
init();

/* Exit confirmation */
document.addEventListener('click',function(e){
  var a=e.target.closest('a[href*="index.html"]');
  if(a&&!a.id){e.preventDefault();if(confirm('Leave game? Your progress will be lost!'))location.assign(a.href);}
});

})();
</script>
