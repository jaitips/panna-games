<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>[hidden]{display:none!important}</style>
<title>Panna's Volcano Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&display=swap">
<style>
  :root {
    --sky-top: #7ccdf4;
    --sky-bottom: #e6f7ff;
    --ground: #5fc25f;
    --ground-dark: #3f9a43;
    --rock: #7a5140;
    --rock-dark: #4e3226;
    --cavity: #33201a;
    --lava: #ff4e1a;
    --lava-hot: #ffc21a;
    --star: #ffd23f;
    --star-dark: #e0a800;
    --heart: #ff3b5c;
    --heart-empty: #d9c9c4;
    --card: #fff9ee;
    --card-edge: #e6d5bd;
    --ink: #2a1f17;
    --ink-soft: #7a685c;
    --ok: #35b65c;
    --bad: #e8452c;
    --btn: #ffffff;
    --btn-edge: #d9c7ac;
    --shadow: 0 6px 0 rgba(74, 48, 30, .18);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Mitr', 'Noto Sans Thai', 'Segoe UI', system-ui, sans-serif;
    font-weight: 500;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    background-attachment: fixed;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 4px solid #2f7bd9; outline-offset: 3px; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.active { display: flex; }

  /* ---------- Menu ---------- */
  #menu { flex-direction: column; align-items: center; overflow-y: auto; padding: clamp(12px, 3vh, 32px) 16px 32px; }
  .menu-head { display: flex; align-items: center; gap: 14px; text-align: left; margin-bottom: 6px; }
  .menu-head svg { width: clamp(72px, 14vw, 120px); height: auto; flex: none; }
  .menu-head h1 { margin: 0; font-size: clamp(26px, 5.5vw, 44px); line-height: 1.05; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
  .menu-head p { margin: 4px 0 0; color: var(--ink-soft); font-size: clamp(14px, 2.2vw, 18px); font-weight: 400; }
  .rules {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px;
    margin: 10px 0 16px; padding: 10px 16px;
    background: rgba(255,255,255,.55); border-radius: 999px;
    font-size: clamp(13px, 2vw, 16px); font-weight: 400;
  }
  .rules span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .subjects {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px; width: min(920px, 100%);
  }
  .subject {
    display: flex; align-items: center; gap: 12px; text-align: left;
    padding: 14px 16px; min-height: 96px;
    background: var(--card); border: 3px solid var(--card-edge); border-radius: 22px;
    box-shadow: var(--shadow);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .subject:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(74,48,30,.18); }
  .subject .badge {
    flex: none; width: 58px; height: 58px; border-radius: 16px;
    display: grid; place-items: center; font-size: 26px; font-weight: 700; color: #fff;
  }
  .subject .name { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .subject .thai { font-size: 13px; color: var(--ink-soft); font-weight: 400; margin-top: 2px; }
  .subject .best { font-size: 13px; color: var(--star-dark); margin-top: 4px; font-weight: 600; }
  .subject.mix { background: linear-gradient(135deg, #fff2df, #ffe1c2); border-color: #f0c9a0; }
  .subject.mix .badge { background: linear-gradient(160deg, var(--lava), var(--lava-hot)); }

  /* ---------- Game ---------- */
  #game { flex-direction: column; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 14px; flex: none;
  }
  .hearts { display: flex; gap: 6px; }
  .hearts svg { width: 34px; height: 34px; transition: transform .2s; }
  .hearts svg.empty path { fill: var(--heart-empty); }
  .hearts svg.pop { animation: pop .45s ease; }
  .progress { display: flex; gap: 5px; align-items: center; }
  .progress i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.75); border: 2px solid rgba(74,48,30,.25); }
  .progress i.done { background: var(--star); border-color: var(--star-dark); }
  .progress i.miss { background: var(--heart-empty); }
  .progress i.now { transform: scale(1.35); border-color: var(--rock-dark); background: #fff; }
  .right { display: flex; align-items: center; gap: 10px; }
  .stars {
    display: flex; align-items: center; gap: 6px; font-size: 24px; font-weight: 700;
    background: rgba(255,255,255,.7); padding: 4px 14px 4px 8px; border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .stars svg { width: 30px; height: 30px; }
  .stars.pop svg { animation: pop .5s ease; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--card-edge);
    background: var(--card); display: grid; place-items: center; font-size: 20px; box-shadow: var(--shadow);
  }

  .stage { flex: 1; display: grid; min-height: 0; grid-template-rows: minmax(150px, 34%) 1fr; }
  .scene { position: relative; min-height: 0; display: flex; align-items: flex-end; justify-content: center; padding: 0 12px; }
  .scene svg { width: 100%; height: 100%; }
  .scene.rumble .volcano-body { animation: rumble .18s infinite; }
  .hurry {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    background: var(--lava); color: #fff; font-weight: 700; padding: 4px 16px; border-radius: 999px;
    opacity: 0; transition: opacity .2s; font-size: 16px; letter-spacing: .04em;
  }
  .scene.rumble .hurry { opacity: 1; animation: blink .5s infinite alternate; }

  .quiz { min-height: 0; overflow-y: auto; padding: 8px 14px 18px; display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--card); border: 3px solid var(--card-edge); border-radius: 26px;
    box-shadow: var(--shadow); padding: 16px 18px; flex: none;
  }
  .subject-tag { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
  .prompt { font-size: clamp(20px, 3.2vw, 28px); font-weight: 700; line-height: 1.3; margin: 4px 0 0; text-wrap: balance; }
  .prompt.big { font-size: clamp(30px, 6vw, 46px); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .media { display: flex; justify-content: center; align-items: center; margin-top: 10px; }
  .media .emoji { font-size: clamp(64px, 12vh, 110px); line-height: 1; }
  .media svg { width: clamp(90px, 16vh, 140px); height: auto; }
  .hint { margin-top: 8px; padding: 8px 12px; background: #fff4d6; border-radius: 12px; font-size: clamp(15px, 2.3vw, 19px); line-height: 1.5; font-weight: 500; color: var(--ink-soft); border: 2px dashed #f0d48a; }
  .hint b { color: var(--ink); }
  .step-badge { display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 999px; background: #ffe6a8; color: var(--ink); font-size: 13px; font-weight: 600; vertical-align: middle; }
  .story { margin-top: 10px; padding: 12px 14px; background: #fff; border-radius: 14px; font-size: clamp(17px, 2.6vw, 22px); line-height: 1.6; font-weight: 400; border: 2px dashed var(--card-edge); }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: none; }
  .opt {
    min-height: 74px; padding: 10px 14px; border-radius: 20px;
    background: var(--btn); border: 3px solid var(--btn-edge); box-shadow: var(--shadow);
    font-size: clamp(19px, 2.8vw, 26px); font-weight: 600; line-height: 1.25;
    display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center;
    transition: transform .1s ease, background .15s, border-color .15s;
    overflow-wrap: anywhere;
  }
  .opt .oe { font-size: clamp(40px, 7vh, 60px); line-height: 1; }
  .opt svg { width: 64px; height: 64px; }
  .opt:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(74,48,30,.18); }
  .opt.ok { background: #d9f7e2; border-color: var(--ok); }
  .opt.bad { background: #ffe1db; border-color: var(--bad); animation: shake .4s; }
  .opt.dim { opacity: .45; }
  .options.locked .opt { pointer-events: none; }

  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 30px);
    background: var(--rock-dark); color: #fff; padding: 12px 22px; border-radius: 999px;
    font-size: 20px; font-weight: 700; opacity: 0; transition: all .25s; pointer-events: none; white-space: nowrap;
    z-index: 5;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.good { background: var(--ok); }
  .toast.bad { background: var(--bad); }

  .fly-star {
    position: fixed; z-index: 6; width: 44px; height: 44px; pointer-events: none;
    animation: fly .8s cubic-bezier(.3,.8,.4,1) forwards;
  }

  /* ---------- End ---------- */
  #end { align-items: center; justify-content: center; padding: 20px; }
  .end-card { width: min(520px, 100%); text-align: center; }
  .end-card h2 { margin: 0; font-size: clamp(28px, 6vw, 40px); font-weight: 700; text-wrap: balance; }
  .end-card p { margin: 6px 0 0; color: var(--ink-soft); font-weight: 400; font-size: 18px; }
  .star-row { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; margin: 18px 0 6px; }
  .star-row svg { width: 40px; height: 40px; animation: pop .5s ease both; }
  .big-score { font-size: clamp(44px, 10vw, 72px); font-weight: 700; line-height: 1; color: var(--star-dark); font-variant-numeric: tabular-nums; }
  .end-actions { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .cta {
    padding: 14px 26px; border-radius: 999px; font-size: 20px; font-weight: 700;
    border: 3px solid var(--rock-dark); background: var(--lava); color: #fff; box-shadow: var(--shadow);
  }
  .cta.quiet { background: var(--card); color: var(--ink); border-color: var(--card-edge); }
  .cta:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(74,48,30,.18); }

  /* ---------- Volcano SVG ---------- */
  .crater-glow { opacity: 0; transition: opacity .4s; }
  .scene.hot .crater-glow { opacity: 1; }
  .blob, .puff { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .scene.erupting .blob { animation: blob 1.3s ease-out forwards; }
  .scene.erupting .puff { animation: puff 1.6s ease-out forwards; }
  .scene.erupting .volcano-body { animation: rumble .12s 8; }
  .cloud { animation: drift 40s linear infinite; }
  .cloud.slow { animation-duration: 60s; animation-delay: -25s; }

  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes rumble { 0% { transform: translate(-1.5px, 1px); } 50% { transform: translate(1.5px, -1px); } 100% { transform: translate(-1px, 0); } }
  @keyframes blink { from { opacity: .75; } to { opacity: 1; } }
  @keyframes blob {
    0% { opacity: 1; transform: translate(0, 0) scale(.6); }
    45% { opacity: 1; transform: translate(var(--dx), var(--dy)) scale(1); }
    100% { opacity: 0; transform: translate(calc(var(--dx) * 1.5), 90px) scale(.8); }
  }
  @keyframes puff {
    0% { opacity: 0; transform: translate(0, 0) scale(.4); }
    30% { opacity: .9; }
    100% { opacity: 0; transform: translate(var(--dx), -110px) scale(2.2); }
  }
  @keyframes drift { from { transform: translateX(-130px); } to { transform: translateX(380px); } }
  @keyframes fly {
    0% { transform: translate(0, 0) scale(1.4); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(.6); opacity: .2; }
  }

  @media (min-width: 760px) and (min-aspect-ratio: 1/1) {
    .stage { grid-template-rows: 1fr; grid-template-columns: minmax(280px, 40%) 1fr; }
    .scene { align-items: center; padding: 0 12px 24px 20px; }
    .quiz { padding: 4px 24px 24px 4px; justify-content: center; }
  }
  @media (max-height: 560px) and (max-width: 759px) {
    .stage { grid-template-rows: minmax(110px, 26%) 1fr; }
    .opt { min-height: 60px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<!-- ================= MENU ================= -->
<section id="menu" class="screen active">
  <div class="menu-head">
    <svg viewBox="0 0 120 100" aria-hidden="true">
      <path d="M8 92 L44 26 Q60 20 76 26 L112 92 Z" fill="#7a5140" stroke="#4e3226" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="60" cy="27" rx="17" ry="5" fill="#3b2418"/>
      <path d="M50 30 Q60 42 70 30 Q66 55 60 60 Q54 55 50 30Z" fill="#ff4e1a"/>
      <circle cx="47" cy="12" r="6" fill="#ff4e1a"/><circle cx="62" cy="4" r="5" fill="#ffc21a"/><circle cx="76" cy="14" r="4" fill="#ff4e1a"/>
    </svg>
    <div>
      <h1>Panna's Volcano Quiz</h1>
      <p>เกมตอบคำถามเตรียมสอบ อนุบาล 3</p>
    </div>
  </div>
  <div class="rules" aria-label="How to play">
    <span>🌋 ลาวาสูงขึ้นระหว่างคิด</span>
    <span>💥 ภูเขาไฟระเบิด = เสียหัวใจ</span>
    <span>✅ ตอบถูก = ได้ ⭐ และหัวใจคืน</span>
    <span>❌ ตอบผิด = ไม่ได้ดาว ลาวาไม่ลด</span>
  </div>
  <div class="subjects" id="subjects"></div>
</section>

<!-- ================= GAME ================= -->
<section id="game" class="screen">
  <div class="topbar">
    <div class="hearts" id="hearts" aria-label="Hearts"></div>
    <div class="progress" id="progress" aria-label="Questions"></div>
    <div class="right">
      <div class="stars" id="stars"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.6 7 .8-5.2 4.8 1.4 7L12 17.7 5.8 21.2l1.4-7L2 9.4l7-.8z" fill="#ffd23f" stroke="#e0a800" stroke-width="1.2" stroke-linejoin="round"/></svg><span id="star-count">0</span></div>
      <button class="icon-btn" id="mute" aria-label="เปิด/ปิดเสียง">🔊</button>
      <button class="icon-btn" id="quit" aria-label="กลับหน้าเลือกวิชา">🏠</button>
    </div>
  </div>
  <div class="stage">
    <div class="scene" id="scene">
      <div class="hurry">เร็วเข้า!</div>
      <svg viewBox="0 0 320 250" aria-label="Volcano timer">
        <defs>
          <clipPath id="cavity-clip"><path d="M62 224 L136 84 Q160 74 184 84 L258 224 Z"/></clipPath>
          <linearGradient id="lava-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffc21a"/><stop offset=".55" stop-color="#ff6a1a"/><stop offset="1" stop-color="#e0301c"/>
          </linearGradient>
          <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffc21a"/><stop offset="1" stop-color="#ff4e1a" stop-opacity="0"/></radialGradient>
        </defs>
        <circle cx="272" cy="42" r="22" fill="#ffe36b"/>
        <g class="cloud" fill="#fff" opacity=".9"><ellipse cx="40" cy="60" rx="26" ry="12"/><ellipse cx="58" cy="52" rx="18" ry="12"/></g>
        <g class="cloud slow" fill="#fff" opacity=".75"><ellipse cx="20" cy="110" rx="20" ry="9"/><ellipse cx="34" cy="104" rx="14" ry="9"/></g>
        <ellipse cx="160" cy="240" rx="175" ry="18" fill="#3f9a43"/>
        <ellipse cx="160" cy="232" rx="165" ry="16" fill="#5fc25f"/>
        <g class="volcano-body">
          <path d="M30 228 L124 66 Q160 52 196 66 L290 228 Z" fill="#7a5140" stroke="#4e3226" stroke-width="3" stroke-linejoin="round"/>
          <path d="M62 224 L136 84 Q160 74 184 84 L258 224 Z" fill="#33201a"/>
          <g clip-path="url(#cavity-clip)">
            <rect id="lava" x="40" y="224" width="240" height="200" fill="url(#lava-grad)"/>
            <rect id="lava-top" x="40" y="222" width="240" height="6" fill="#ffe08a" opacity=".9"/>
          </g>
          <ellipse cx="160" cy="66" rx="40" ry="10" fill="#3b2418"/>
          <ellipse cx="160" cy="66" rx="30" ry="6" fill="#221410"/>
          <ellipse class="crater-glow" cx="160" cy="66" rx="30" ry="6" fill="#ff6a1a"/>
          <ellipse class="crater-glow" cx="160" cy="64" rx="56" ry="26" fill="url(#glow)" opacity=".7"/>
          <path d="M96 150 l10 -8 l6 12" fill="none" stroke="#4e3226" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M214 176 l8 -10 l7 9" fill="none" stroke="#4e3226" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <g class="eruption">
          <circle class="puff" cx="160" cy="60" r="16" fill="#9a8f8a" style="--dx:-30px"/>
          <circle class="puff" cx="160" cy="60" r="20" fill="#b3aaa5" style="--dx:10px; animation-delay:.1s"/>
          <circle class="puff" cx="160" cy="60" r="14" fill="#857a75" style="--dx:40px; animation-delay:.2s"/>
          <circle class="blob" cx="160" cy="60" r="12" fill="#ff4e1a" style="--dx:-70px; --dy:-90px"/>
          <circle class="blob" cx="160" cy="60" r="9" fill="#ffc21a" style="--dx:-30px; --dy:-120px; animation-delay:.05s"/>
          <circle class="blob" cx="160" cy="60" r="14" fill="#ff6a1a" style="--dx:10px; --dy:-130px; animation-delay:.1s"/>
          <circle class="blob" cx="160" cy="60" r="10" fill="#ffc21a" style="--dx:50px; --dy:-105px; animation-delay:.15s"/>
          <circle class="blob" cx="160" cy="60" r="12" fill="#ff4e1a" style="--dx:85px; --dy:-70px; animation-delay:.08s"/>
          <circle class="blob" cx="160" cy="60" r="7" fill="#ffe08a" style="--dx:-95px; --dy:-50px; animation-delay:.2s"/>
        </g>
      </svg>
    </div>
    <div class="quiz">
      <div class="card">
        <div class="subject-tag"><span id="q-tag">Math</span><span class="step-badge" id="q-step" hidden></span></div>
        <h2 class="prompt" id="q-prompt"></h2>
        <div class="hint" id="q-hint" hidden></div>
        <div class="media" id="q-media"></div>
        <div class="story" id="q-story" hidden></div>
      </div>
      <div class="options" id="options"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</section>

<!-- ================= END ================= -->
<section id="end" class="screen">
  <div class="card end-card">
    <h2 id="end-title">จบรอบแล้ว!</h2>
    <p id="end-sub"></p>
    <div class="star-row" id="end-stars"></div>
    <div class="big-score"><span id="end-score">0</span> <span style="font-size:.45em; color:var(--ink-soft)">/ 10</span></div>
    <p id="end-best"></p>
    <div class="end-actions">
      <button class="cta" id="again">เล่นอีกครั้ง</button>
      <button class="cta quiet" id="to-menu">เลือกวิชา</button>
    </div>
  </div>
</section>
<script>
(() => {
  'use strict';

  // ---------- tiny helpers ----------
  const rnd = (n) => Math.floor(Math.random() * n);
  const between = (a, b) => a + rnd(b - a + 1);
  const pick = (arr) => arr[rnd(arr.length)];
  const shuffle = (arr) => {
    const out = arr.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = rnd(i + 1);
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  };
  const sample = (arr, n, exclude = []) => {
    const pool = shuffle(arr.filter((x) => !exclude.includes(x)));
    return pool.slice(0, n);
  };
  // Build a 4-option question. `correct` and `wrongs` are option objects {t, e, svg}.
  const mc = (prompt, correct, wrongs, extra = {}) => {
    const options = shuffle([correct, ...wrongs.slice(0, 3)]);
    return { prompt, options, answer: options.indexOf(correct), ...extra };
  };
  // Multi-step question: each step is an mc() question; only the last step earns the star.
  const guided = (steps, extra = {}) => ({ steps, prompt: steps.map((st) => st.prompt).join(' | '), ...extra });
  const T = (t) => ({ t });
  const E = (e, t) => ({ e, t });
  const uniqueBy = (arr, key) => {
    const seen = new Set();
    return arr.filter((x) => (seen.has(key(x)) ? false : (seen.add(key(x)), true)));
  };
  const numWrongs = (c, min = 0) => {
    const cands = shuffle([c + 1, c - 1, c + 10, c - 10, c + 2, c - 2, c + 100, c - 100, c + 11, c - 9])
      .filter((v) => v !== c && v >= min);
    return uniqueBy(cands, (v) => v).slice(0, 3).map((v) => T(String(v)));
  };

  // =====================================================================
  //  MATH — พื้นฐานการคิดคำนวณ
  // =====================================================================
  const twoOrThree = () => (Math.random() < 0.8 ? between(12, 89) : between(100, 899));

  ];
  const hygiene = () => {
    const [q, ans, wrongs] = pick(HYGIENE);
    const A = typeof ans === 'string' ? T(ans) : ans;
    const W = wrongs.map((w) => (typeof w === 'string' ? T(w) : w));
    return mc(q, A, W, { time: 25 });
  };
  // [purpose, place, emoji]
  const PLACES = [['ยืมหนังสือ', 'ห้องสมุด', '📚'], ['ซื้อกับข้าว', 'ตลาด', '🛒'], ['หาหมอเมื่อป่วย', 'โรงพยาบาล', '🏥'], ['เรียนหนังสือ', 'โรงเรียน', '🏫'], ['ดูสิงโตและช้าง', 'สวนสัตว์', '🦁'], ['ส่งจดหมาย', 'ที่ทำการไปรษณีย์', '📮'], ['ขึ้นรถไฟ', 'สถานีรถไฟ', '🚉'], ['ขึ้นเครื่องบิน', 'สนามบิน', '✈️'], ['ทำบุญตักบาตร', 'วัด', '🛕'], ['ซื้อยา', 'ร้านขายยา', '💊'], ['ว่ายน้ำ', 'สระว่ายน้ำ', '🏊'], ['เล่นชิงช้าและกระดานลื่น', 'สนามเด็กเล่น', '🛝'], ['ดูหนัง', 'โรงหนัง', '🎬'], ['ฝากเงิน', 'ธนาคาร', '🏦'], ['กินข้าวนอกบ้านกับครอบครัว', 'ร้านอาหาร', '🍽️'], ['เติมน้ำมันรถ', 'ปั๊มน้ำมัน', '⛽'], ['รอรถเมล์', 'ป้ายรถเมล์', '🚏'], ['เล่นทรายและน้ำทะเล', 'ชายหาด', '🏖️'], ['ซื้อเสื้อผ้าและของเล่น', 'ห้างสรรพสินค้า', '🏬'], ['นอนหลับตอนกลางคืน', 'บ้าน', '🏠']];
  const places = () => {
    const [purpose, place, emoji] = pick(PLACES);
    const others = PLACES.filter((p) => p[1] !== place);
    if (Math.random() < 0.6) return mc(`เราไป${purpose}ที่ไหน`, E(emoji, place), sample(others, 3).map((p) => E(p[2], p[1])), {});
    return mc(`ที่${place} เราไปทำอะไร`, T(purpose), sample(others, 3).map((p) => T(p[0])), { media: { emoji } });
  };

  // =====================================================================
  //  SUBJECTS
  // =====================================================================
  const SUBJECTS = {
    math: { name: 'คิดคำนวณ', thai: 'พื้นฐานการคิดคำนวณ', icon: '1+2', color: '#2f7bd9', gens: [addCarry, subBorrow, wordProblem, middleValue, numberSentence] },
    thai: { name: 'ภาษาไทย', thai: 'ภาษาไทยพื้นฐาน', icon: 'ก', color: '#e8452c', gens: [vowelForm, opposite, classifier, story, sentenceOrder, fillBlank, hoNam] },
    english: { name: 'English', thai: 'ภาษาอังกฤษพื้นฐาน', icon: 'Aa', color: '#35b65c', gens: [enWhatIsThis, enFindIt, enCategory, enSpelling] },
    brain: { name: 'เชาวน์ปัญญา', thai: 'เชาวน์ปัญญาพื้นฐาน', icon: '🧠', color: '#9b59b6', gens: [shapeName, shapeFind, shapeSides, oddOneOut, matching] },
    world: { name: 'ความรู้ทั่วไป', thai: 'บุคคล · กิจวัตร · สุขนิสัย · สถานที่', icon: '🌍', color: '#ff8c1a', gens: [people, routine, hygiene, places] },
  };
  const MIX = { name: 'รวมทุกวิชา', thai: 'สุ่มทุกวิชา เหมือนสอบจริง', icon: '🌋', color: '#ff4e1a' };

  const ROUND = 10;
  const MAX_HEARTS = 3;
  const DEFAULT_TIME = 20;

  // ---------- storage ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('volcano.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('volcano.' + k, JSON.stringify(v)); } catch { /* private mode etc. */ } },
  };

  // ---------- sound ----------
  let audioCtx = null;
  let muted = store.get('muted', false);
  const tone = (freq, dur, type = 'sine', gain = 0.15, when = 0) => {
    if (muted) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime + when;
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.05);
    } catch { /* no audio */ }
  };
  const sfx = {
    correct: () => { tone(660, .12, 'triangle', .18); tone(880, .14, 'triangle', .18, .1); tone(1320, .25, 'triangle', .16, .2); },
    wrong: () => { tone(200, .25, 'square', .08); tone(150, .3, 'square', .08, .15); },
    erupt: () => { tone(80, .6, 'sawtooth', .2); tone(60, .8, 'sawtooth', .18, .1); tone(400, .15, 'square', .06, .05); },
    tick: () => tone(1000, .05, 'square', .04),
    tap: () => tone(500, .05, 'sine', .06),
  };

  // ---------- state ----------
  const $ = (id) => document.getElementById(id);
  const screens = { menu: $('menu'), game: $('game'), end: $('end') };
  const show = (name) => Object.entries(screens).forEach(([k, el]) => el.classList.toggle('active', k === name));
  const state = { subjectKey: null, qIndex: 0, hearts: MAX_HEARTS, stars: 0, results: [], q: null, lava: 0, lavaTime: DEFAULT_TIME, running: false, lastT: 0, raf: 0, lastTick: 0, usedPrompts: new Set(), lastGen: null, step: 0 };

  // ---------- menu ----------
  const HEART = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8 3.4 4.5 7 4.5c2 0 3.6 1.1 5 2.8 1.4-1.7 3-2.8 5-2.8 3.6 0 6 3.5 4.5 7.3C19.5 16.4 12 21 12 21z" fill="#ff3b5c" stroke="#b7203c" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2l3 6.6 7 .8-5.2 4.8 1.4 7L12 17.7 5.8 21.2l1.4-7L2 9.4l7-.8z" fill="#ffd23f" stroke="#e0a800" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  const buildMenu = () => {
    const wrap = $('subjects');
    wrap.innerHTML = '';
    const entries = [...Object.entries(SUBJECTS), ['mix', MIX]];
    entries.forEach(([key, s]) => {
      const best = store.get('best.' + key, null);
      const btn = document.createElement('button');
      btn.className = 'subject' + (key === 'mix' ? ' mix' : '');
      btn.innerHTML = `<span class="badge" style="background:${s.color}">${s.icon}</span><span><span class="name">${s.name}</span><div class="thai">${s.thai}</div>${best === null ? '' : `<div class="best">ดีที่สุด: ${best} ⭐</div>`}</span>`;
      btn.addEventListener('click', () => { sfx.tap(); startRound(key); });
      wrap.appendChild(btn);
    });
  };

  // ---------- game ----------
  const renderHearts = (popIndex = -1) => {
    $('hearts').innerHTML = Array.from({ length: MAX_HEARTS }, (_, i) => HEART.replace('<svg', `<svg class="${i < state.hearts ? '' : 'empty'}${i === popIndex ? ' pop' : ''}"`)).join('');
  };
  const renderProgress = () => {
    $('progress').innerHTML = Array.from({ length: ROUND }, (_, i) => `<i class="${state.results[i] === true ? 'done' : state.results[i] === false ? 'miss' : ''}${i === state.qIndex ? ' now' : ''}"></i>`).join('');
  };
  const renderStars = () => { $('star-count').textContent = state.stars; };

  const optionHtml = (o) => {
    if (o.svg) return o.svg;
    if (o.e && o.t) return `<span class="oe">${o.e}</span><span>${o.t}</span>`;
    if (o.e) return `<span class="oe">${o.e}</span>`;
    return `<span>${o.t}</span>`;
  };

  const pickQuestion = () => {
    const subj = state.subjectKey === 'mix' ? SUBJECTS[pick(Object.keys(SUBJECTS))] : SUBJECTS[state.subjectKey];
    let gens = subj.gens.filter((g) => g !== state.lastGen);
    if (gens.length === 0) gens = subj.gens;
    for (let tries = 0; tries < 12; tries++) {
      const gen = pick(gens);
      const q = gen();
      if (state.usedPrompts.has(q.prompt + (q.story || '') + (q.media?.emoji || ''))) continue;
      state.usedPrompts.add(q.prompt + (q.story || '') + (q.media?.emoji || ''));
      state.lastGen = gen;
      q.subject = subj.name;
      return q;
    }
    const q = pick(subj.gens)();
    q.subject = subj.name;
    return q;
  };

  const curStep = () => (state.q.steps ? state.q.steps[state.step] : state.q);
  const isLastStep = () => !state.q.steps || state.step >= state.q.steps.length - 1;

  const showQuestion = () => {
    const q = pickQuestion();
    state.q = q;
    state.step = 0;
    $('q-tag').textContent = q.subject;
    renderStep();
  };

  const renderStep = () => {
    const q = curStep();
    const stepEl = $('q-step');
    stepEl.hidden = !state.q.steps;
    if (state.q.steps) stepEl.textContent = `ขั้นที่ ${state.step + 1}/${state.q.steps.length}`;
    const hintEl = $('q-hint');
    hintEl.hidden = !q.hint;
    hintEl.innerHTML = q.hint || '';
    const promptEl = $('q-prompt');
    promptEl.textContent = '';
    q.prompt.split('\n').forEach((line, i) => {
      if (i > 0) promptEl.appendChild(document.createElement('br'));
      promptEl.appendChild(document.createTextNode(line));
    });
    promptEl.classList.toggle('big', !!q.big);
    const media = $('q-media');
    media.innerHTML = q.media?.emoji ? `<span class="emoji">${q.media.emoji}</span>` : q.media?.svg ? q.media.svg : '';
    media.hidden = !q.media;
    const storyEl = $('q-story');
    storyEl.hidden = !q.story;
    storyEl.textContent = q.story || '';
    const opts = $('options');
    opts.classList.remove('locked');
    opts.innerHTML = '';
    q.options.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = optionHtml(o);
      b.addEventListener('click', () => answer(i, b));
      opts.appendChild(b);
    });
    $('options').parentElement.scrollTop = 0;
    renderProgress();
    // reset lava only when the previous answer was right (or a fresh question after eruption)
    state.lavaTime = q.time || DEFAULT_TIME;
    state.running = true;
    state.lastT = performance.now();
    cancelAnimationFrame(state.raf);
    state.raf = requestAnimationFrame(tickLava);
  };

  const setLava = (pct) => {
    const top = 84; const bottom = 224;
    const y = bottom - (bottom - top) * pct;
    $('lava').setAttribute('y', y);
    $('lava-top').setAttribute('y', pct > 0.03 ? y - 3 : 240);
    const scene = $('scene');
    scene.classList.toggle('hot', pct > 0.6);
    scene.classList.toggle('rumble', pct > 0.72 && state.running);
  };

  const tickLava = (now) => {
    if (!state.running) return;
    const dt = (now - state.lastT) / 1000;
    state.lastT = now;
    state.lava = Math.min(1, state.lava + dt / state.lavaTime);
    setLava(state.lava);
    if (state.lava > 0.72 && now - state.lastTick > 500) { state.lastTick = now; sfx.tick(); }
    if (state.lava >= 1) { erupt(); return; }
    state.raf = requestAnimationFrame(tickLava);
  };

  const toast = (msg, kind) => {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (kind || '');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 1400);
  };

  const flyStar = (from) => {
    const target = $('stars').getBoundingClientRect();
    const r = from.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'fly-star';
    el.innerHTML = STAR;
    el.style.left = (r.left + r.width / 2 - 22) + 'px';
    el.style.top = (r.top + r.height / 2 - 22) + 'px';
    el.style.setProperty('--tx', (target.left + target.width / 2 - (r.left + r.width / 2)) + 'px');
    el.style.setProperty('--ty', (target.top + target.height / 2 - (r.top + r.height / 2)) + 'px');
    document.body.appendChild(el);
    setTimeout(() => { el.remove(); $('stars').classList.add('pop'); setTimeout(() => $('stars').classList.remove('pop'), 500); }, 780);
  };

  const revealAnswer = (chosen) => {
    const opts = $('options');
    opts.classList.add('locked');
    [...opts.children].forEach((b, i) => {
      if (i === curStep().answer) b.classList.add('ok');
      else if (i === chosen) b.classList.add('bad');
      else b.classList.add('dim');
    });
  };

  const nextOrEnd = (delay) => {
    setTimeout(() => {
      state.qIndex += 1;
      if (state.hearts <= 0 || state.qIndex >= ROUND) { endRound(); return; }
      showQuestion();
    }, delay);
  };

  const answer = (i, btn) => {
    if (!state.running) return;
    state.running = false;
    cancelAnimationFrame(state.raf);
    $('scene').classList.remove('rumble');
    const right = i === curStep().answer;
    revealAnswer(i);
    if (!isLastStep()) {
      // intermediate step: no star yet; correct resets lava, wrong keeps it rising
      if (right) { sfx.correct(); state.lava = 0; setLava(0); toast('ใช่เลย! ไปขั้นต่อไป 👉', 'good'); }
      else { sfx.wrong(); toast('ยังไม่ใช่ ดูเฉลยแล้วไปต่อกัน', 'bad'); }
      setTimeout(() => { state.step += 1; renderStep(); }, right ? 900 : 1700);
      return;
    }
    state.results[state.qIndex] = right;
    if (right) {
      sfx.correct();
      state.stars += 1;
      flyStar(btn);
      const healed = state.hearts < MAX_HEARTS;
      state.hearts = Math.min(MAX_HEARTS, state.hearts + 1);
      renderHearts(healed ? state.hearts - 1 : -1);
      state.lava = 0;
      setLava(0);
      toast(healed ? 'ถูกต้อง! ⭐ ได้หัวใจคืน ❤️' : 'ถูกต้อง! ⭐', 'good');
      renderProgress();
      nextOrEnd(1100);
      return;
    }
    sfx.wrong();
    toast('ยังไม่ใช่นะ ลาวายังสูงขึ้นอยู่!', 'bad');
    renderProgress();
    nextOrEnd(1700);
  };

  const erupt = () => {
    state.running = false;
    cancelAnimationFrame(state.raf);
    const scene = $('scene');
    scene.classList.remove('rumble');
    scene.classList.remove('erupting');
    void scene.offsetWidth; // restart animation
    scene.classList.add('erupting');
    sfx.erupt();
    if (navigator.vibrate) navigator.vibrate([120, 60, 160]);
    state.hearts -= 1;
    renderHearts();
    revealAnswer(-1);
    state.results[state.qIndex] = false;
    renderProgress();
    toast('ตูม! ภูเขาไฟระเบิด 💔', 'bad');
    setTimeout(() => { state.lava = 0; setLava(0); scene.classList.remove('erupting'); }, 1400);
    nextOrEnd(1800);
  };

  const startRound = (key) => {
    state.subjectKey = key;
    state.qIndex = 0; state.hearts = MAX_HEARTS; state.stars = 0; state.results = [];
    state.lava = 0; state.usedPrompts = new Set(); state.lastGen = null;
    renderHearts(); renderStars(); setLava(0);
    $('scene').classList.remove('erupting', 'hot', 'rumble');
    show('game');
    showQuestion();
  };

  const endRound = () => {
    state.running = false;
    cancelAnimationFrame(state.raf);
    const key = state.subjectKey;
    const best = store.get('best.' + key, 0);
    const isBest = state.stars > best;
    if (isBest) store.set('best.' + key, state.stars);
    const lost = state.hearts <= 0;
    $('end-title').textContent = lost ? 'รอบนี้ภูเขาไฟชนะ!' : state.stars === ROUND ? 'เต็ม 10 ดาว สุดยอด! 🎉' : state.stars >= 7 ? 'เก่งมาก Panna!' : 'จบรอบแล้ว!';
    $('end-sub').textContent = lost ? `ตอบไปแล้ว ${state.qIndex} ข้อ ก่อนภูเขาไฟจะระเบิดครั้งสุดท้าย` : `เหลือหัวใจ ${state.hearts} ดวง · ${key === 'mix' ? MIX.name : SUBJECTS[key].name}`;
    $('end-stars').innerHTML = Array.from({ length: ROUND }, (_, i) => STAR.replace('<svg', `<svg style="animation-delay:${i * 70}ms; opacity:${i < state.stars ? 1 : .18}"`)).join('');
    $('end-score').textContent = state.stars;
    $('end-best').textContent = isBest ? 'สถิติใหม่! 🏆' : `สถิติที่ดีที่สุด: ${Math.max(best, state.stars)} ⭐`;
    show('end');
    if (!lost) { tone(523, .15, 'triangle', .15); tone(659, .15, 'triangle', .15, .15); tone(784, .15, 'triangle', .15, .3); tone(1047, .4, 'triangle', .15, .45); }
  };

  // ---------- wiring ----------
  const setMuteIcon = () => { $('mute').textContent = muted ? '🔇' : '🔊'; };
  $('mute').addEventListener('click', () => { muted = !muted; store.set('muted', muted); setMuteIcon(); if (!muted) sfx.tap(); });
  $('quit').addEventListener('click', () => { state.running = false; cancelAnimationFrame(state.raf); buildMenu(); show('menu'); });
  $('again').addEventListener('click', () => { sfx.tap(); startRound(state.subjectKey); });
  $('to-menu').addEventListener('click', () => { sfx.tap(); buildMenu(); show('menu'); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { state.paused = state.running; state.running = false; cancelAnimationFrame(state.raf); return; }
    if (!state.paused) return;
    state.paused = false; state.running = true; state.lastT = performance.now(); state.raf = requestAnimationFrame(tickLava);
  });
  document.addEventListener('keydown', (e) => {
    if (!screens.game.classList.contains('active')) return;
    const n = parseInt(e.key, 10);
    if (!(n >= 1 && n <= 4)) return;
    const btn = $('options').children[n - 1];
    if (btn) btn.click();
  });

  setMuteIcon();
  buildMenu();
  setLava(0);
})();
</script>
</body>
</html>
