<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Land the Rocket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
/* Layout: one full-screen canvas stage; candy cards float over it for title, map and results. */
:root{
  --night:#1a1c4a; --night-2:#2c2f78; --cream:#fff6dd; --ink:#2a2350;
  --sun:#ffd23f; --sun-deep:#d99a00; --pink:#ff5d8f; --pink-deep:#c9366a;
  --mint:#2fd39a; --mint-deep:#159a6c; --sky:#5cc8ff;
  --font:'Fredoka','Baloo 2','Comic Sans MS',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

.screen{position:absolute;inset:0;display:flex;overflow-y:auto;padding-block:20px;padding-inline:16px;text-align:center}
.wrap{margin:auto;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.6vh,22px);max-width:640px;width:100%}
#title{background:linear-gradient(rgba(26,28,74,.18),rgba(26,28,74,.5))}
#map,#card{background:rgba(26,28,74,.78)}

.eyebrow{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(12px,1.9vh,16px);
  background:var(--ink);color:var(--sun);padding:6px 14px;border-radius:999px}
h1{margin:0;font-weight:700;font-size:clamp(44px,11vh,96px);line-height:.95;color:#fff;text-wrap:balance;
  text-shadow:0 5px 0 var(--pink-deep),0 10px 0 rgba(26,28,74,.55)}
h1 span{color:var(--sun)}
h2{margin:0;font-weight:700;font-size:clamp(28px,6vh,48px);line-height:1.05;text-wrap:balance}
p{margin:0;font-size:clamp(16px,2.6vh,22px);line-height:1.35;max-width:32em}
.lead{font-weight:600;color:#fff;text-shadow:0 2px 0 rgba(26,28,74,.7)}

.panel{background:var(--cream);color:var(--ink);border-radius:28px;padding:clamp(14px,2.6vh,24px);
  box-shadow:0 8px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,16px);width:100%;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}

button{font-family:var(--font);cursor:pointer;border:0;color:var(--ink)}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
.btn{font-weight:700;font-size:clamp(18px,3vh,26px);padding:.55em 1.2em;border-radius:999px;background:var(--sun);
  box-shadow:0 6px 0 var(--sun-deep);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-deep)}
.btn.big{font-size:clamp(22px,min(4.4vh,7vw),38px);background:var(--pink);color:#fff;box-shadow:0 7px 0 var(--pink-deep)}
.btn.big:active{box-shadow:0 3px 0 var(--pink-deep)}
.btn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-deep)}
.btn.plain{background:#fff;box-shadow:0 6px 0 #c9c3e6}
.diff{font-weight:600;font-size:clamp(16px,2.6vh,22px);padding:.5em 1em;border-radius:18px;background:#fff;
  box-shadow:0 5px 0 #c9c3e6;display:flex;flex-direction:column;align-items:center;min-width:6.2em}
.diff .d-icon{font-size:1.7em;line-height:1.1}
.diff[aria-pressed="true"]{background:var(--mint);box-shadow:0 5px 0 var(--mint-deep)}

#worlds{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:100%}
.world{background:var(--cream);border-radius:24px;padding:12px 10px 14px;width:clamp(128px,20vw,150px);
  display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 7px 0 rgba(0,0,0,.28)}
.world:active{transform:translateY(4px)}
.world.next{animation:hop 1.1s ease-in-out infinite;background:#fff;box-shadow:0 7px 0 var(--pink-deep),0 0 0 5px var(--pink)}
.w-icon{font-size:clamp(40px,8vh,58px);line-height:1.1}
.w-name{font-weight:700;font-size:18px}
.w-stars{font-size:22px;color:#e8a400;letter-spacing:2px}
.w-grav{font-size:13px;font-weight:600;opacity:.7;font-variant-numeric:tabular-nums}
.w-done{font-size:13px;font-weight:700;color:var(--mint-deep)}
#trophy{font-weight:700;font-size:clamp(18px,3vh,26px);color:var(--sun)}

#c-stars{font-size:clamp(44px,9vh,72px);letter-spacing:6px;color:#e8a400;line-height:1}
#c-badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.badge{background:var(--ink);color:#fff;font-weight:600;font-size:clamp(14px,2.3vh,18px);padding:6px 14px;border-radius:999px}
#c-fact{font-weight:600}
#c-tip{font-weight:600}

#hud{position:absolute;inset:0 0 auto 0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  padding:10px 12px;pointer-events:none}
#hud > *{pointer-events:auto}
.chip{background:rgba(26,28,74,.78);color:#fff;border-radius:18px;padding:6px 14px;font-weight:600;
  font-size:clamp(14px,2.3vh,18px);display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:0}
.chip small{font-weight:400;font-size:.78em;opacity:.85;font-variant-numeric:tabular-nums}
#h-stars{font-size:1.25em;letter-spacing:3px;color:var(--sun)}
.round{width:52px;height:52px;border-radius:50%;background:var(--cream);font-size:24px;box-shadow:0 5px 0 rgba(0,0,0,.3);flex:none}
.round:active{transform:translateY(3px)}
.hud-mid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-width:0}

@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@media (prefers-reduced-motion:reduce){.world.next{animation:none}}
</style>

</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="Rocket landing game"></canvas>

  <div id="hud" hidden>
    <button class="round" id="b-home" aria-label="Back to the map">🗺️</button>
    <div class="hud-mid">
      <div class="chip"><span id="h-name">Launch Pad</span><small id="h-grav">Gravity 9.8 m/s²</small></div>
      <div class="chip"><span id="h-stars">☆☆☆</span></div>
    </div>
    <button class="round" id="b-mute" aria-label="Sound on or off">🔊</button>
  </div>

  <section class="screen" id="title">
    <div class="wrap">
      <span class="eyebrow" id="t-eyebrow">PANNA 1 · Mission: come home</span>
      <h1>Land the <span>Rocket</span></h1>
      <p class="lead">The satellite is in orbit. Now bring the rocket home!</p>
      <div class="panel">
        <div class="row" id="diffs"></div>
        <button class="btn big" id="b-play">Let’s fly 🚀</button>
      </div>
    </div>
  </section>

  <section class="screen" id="map" hidden>
    <div class="wrap">
      <h2>Where shall we land?</h2>
      <div id="worlds"></div>
      <div id="trophy" hidden>🏆 Master Rocket Pilot! You landed everywhere.</div>
      <button class="btn plain" id="b-back">◀ Change level</button>
    </div>
  </section>

  <section class="screen" id="card" hidden>
    <div class="wrap">
      <div class="panel">
        <h2 id="c-title">Touchdown!</h2>
        <div id="c-stars" hidden>★★★</div>
        <div id="c-badges" hidden></div>
        <p id="c-fact" hidden></p>
        <p id="c-tip" hidden></p>
        <div class="row">
          <button class="btn big" id="b-primary">Try again 🚀</button>
        </div>
        <div class="row">
          <button class="btn mint" id="b-again" hidden>Again 🔁</button>
          <button class="btn plain" id="b-map">Map 🗺️</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';

/* ================= TUNING ================= */
const CFG = {
  rocketName: 'PANNA 1',
  pilot: 'Panna',
  speech: true,            // spoken mission control (device voice)
  rocketH: 0.16,           // sizes are in screen-heights
  rocketW: 0.038,
  groundY: 0.84,           // top of the landing pad
  thrust: 2.1,             // engine push, in multiples of Earth game-gravity
  steerKp: 7, steerKd: 4.6, steerMax: 1.3,   // rocket follows the finger
  keySteer: 0.7,
  starRadius: 0.075,       // generous star pickup
  legsAt: 0.34,            // legs unfold this far above the pad
  celebrateSecs: 5.2,
  bullZone: 0.35,          // middle part of the pad that counts as bullseye
};
// g and safe are screen-heights per second (so it feels the same on any device)
const DIFF = {
  cadet:     { label: 'Cadet',     icon: '🐣', g: 0.24, safe: 0.34, padW: 0.32, fuel: Infinity, shipAmp: 0.07, shipSecs: 9,   rockEvery: 3.6, wind: 0.10, startOff: 0.16 },
  pilot:     { label: 'Pilot',     icon: '🚀', g: 0.33, safe: 0.27, padW: 0.24, fuel: 9,        shipAmp: 0.15, shipSecs: 7.5, rockEvery: 2.4, wind: 0.20, startOff: 0.24 },
  commander: { label: 'Commander', icon: '🌟', g: 0.44, safe: 0.21, padW: 0.17, fuel: 6,        shipAmp: 0.22, shipSecs: 6,   rockEvery: 1.5, wind: 0.32, startOff: 0.32 },
};
const WORLDS = [
  { id: 'pad', name: 'Launch Pad', icon: '🚀', gravity: 9.8, padAt: 0.5,
    landed: 'Home on the launch pad!',
    intro: 'Bring the rocket home. Hold to fire the engine, and land softly on the pad.',
    fact: 'Real rockets can fly back and land standing up. Then they can fly again!' },
  { id: 'ship', name: 'Ocean Ship', icon: '🚢', gravity: 9.8, padAt: 0.5,
    landed: 'Landed on the ship!',
    intro: 'The ship is moving. Follow it with your finger.',
    fact: 'Some rockets land on a robot ship far out at sea. Nobody is on board!' },
  { id: 'volcano', name: 'Volcano Island', icon: '🌋', gravity: 9.8, padAt: 0.66,
    landed: 'Landed on Volcano Island!',
    intro: 'Watch out for hot rocks from the volcano.',
    fact: 'Volcanoes throw out glowing rocks. Scientists call them lava bombs.' },
  { id: 'moon', name: 'The Moon', icon: '🌙', gravity: 1.6, padAt: 0.5,
    landed: 'Touchdown on the Moon!',
    intro: 'Moon gravity is weak. You fall slowly here. Little pushes are enough.',
    fact: 'Moon gravity is 6 times weaker than Earth’s. Everything falls slowly there.' },
  { id: 'mars', name: 'Mars', icon: '🔴', gravity: 3.7, padAt: 0.5,
    landed: 'Touchdown on Mars!',
    intro: 'The wind on Mars pushes the rocket. Hold on tight.',
    fact: 'Mars is the Red Planet. Its dust storms can cover the whole planet.' },
];
// Softened so the Moon feels floaty but still comes down in a few seconds.
WORLDS.forEach((w) => { w.gmul = Math.sqrt(w.gravity / 9.8); });
const FAIL = {
  fast:   { title: 'Too fast!',        tip: 'Hold the engine longer before the pad. Land when the lights are green.', say: 'Too fast. Fire the engine a little longer.' },
  miss:   { title: 'Missed the pad!',  tip: 'Slide your finger over the pad. The rocket follows your finger.',        say: 'We missed the pad. Slide over it next time.' },
  splash: { title: 'Splash!',          tip: 'The ship moves. Follow it with your finger.',                            say: 'Splash! Follow the ship next time.' },
};

/* ================= HELPERS ================= */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => { const c = clamp(t, 0, 1); return 1 - (1 - c) * (1 - c); };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const mulberry = (seed) => {
  const st = { a: seed };
  return () => {
    st.a = (st.a + 0x6D2B79F5) | 0;
    const t1 = Math.imul(st.a ^ (st.a >>> 15), 1 | st.a);
    const t2 = (t1 + Math.imul(t1 ^ (t1 >>> 7), 61 | t1)) ^ t1;
    return ((t2 ^ (t2 >>> 14)) >>> 0) / 4294967296;
  };
};

const cv = $('cv');
const ctx = cv.getContext('2d');
const view = { W: 1.6, S: 600, dpr: 1 };
const GY = CFG.groundY;

/* ================= SAVED STUFF ================= */
const STORE_KEY = 'land-the-rocket';
const store = (() => {
  const base = { diff: 'cadet', muted: false, best: {} };
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? Object.assign(base, JSON.parse(raw)) : base;
  } catch (e) { return base; }
})();
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* fine */ } };
const bestOf = (diff, id) => (store.best[diff] || {})[id] || null;

/* ================= STATE ================= */
const input = { down: false, x: 0, left: false, right: false, up: false };
const S = {
  diff: DIFF[store.diff] ? store.diff : 'cadet',
  world: WORLDS[0], phase: 'demo', t: 0, last: 0,
  rocket: { x: 0.8, y: 0.5, vx: 0, vy: 0, tilt: 0, legs: 1, fuel: Infinity, thrusting: true, sink: 0 },
  stars: [], rocks: [], parts: [], scene: null,
  gust: { a: 0, until: 0, next: 2.2 }, rockT: 1.5,
  got: 0, landT: 0, failT: 0, failKind: 'fast', failDir: 1, result: null,
  cardShown: false, ceilT: 0, rideOff: 0, padW: 0.3, flags: {},
};

/* ================= SOUND ================= */
const audio = { ctx: null, engine: null, muted: Boolean(store.muted) };
const initAudio = () => {
  if (audio.ctx) { audio.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ac = new AC();
  const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  const filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 340;
  const gain = ac.createGain(); gain.gain.value = 0;
  src.connect(filt); filt.connect(gain); gain.connect(ac.destination); src.start();
  audio.ctx = ac; audio.engine = gain;
};
const setEngine = (on) => {
  if (!audio.ctx) return;
  const target = on && !audio.muted ? 0.24 : 0;
  audio.engine.gain.setTargetAtTime(target, audio.ctx.currentTime, 0.05);
};
const tone = (freq, dur, opt = {}) => {
  if (!audio.ctx || audio.muted) return;
  const ac = audio.ctx;
  const t0 = ac.currentTime + (opt.delay || 0);
  const o = ac.createOscillator(); const g = ac.createGain();
  o.type = opt.type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (opt.slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * opt.slide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(opt.vol || 0.16, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.05);
};
const sfx = {
  star: () => { tone(880, 0.12, { type: 'triangle' }); tone(1320, 0.18, { type: 'triangle', delay: 0.08 }); },
  land: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.28, { type: 'triangle', delay: i * 0.11, vol: 0.2 })),
  bonk: () => { tone(160, 0.35, { type: 'sawtooth', slide: 0.35, vol: 0.18 }); tone(90, 0.3, { type: 'square', slide: 0.5, vol: 0.1, delay: 0.05 }); },
  splash: () => { tone(500, 0.4, { type: 'sine', slide: 0.25, vol: 0.18 }); tone(300, 0.3, { type: 'triangle', slide: 0.4, vol: 0.12, delay: 0.1 }); },
  rock: () => tone(220, 0.2, { type: 'square', slide: 0.5, vol: 0.12 }),
  pop: () => tone(rand(500, 900), 0.18, { type: 'triangle', slide: 0.5, vol: 0.08 }),
  roar: () => { tone(140, 0.7, { type: 'sawtooth', slide: 0.6, vol: 0.16 }); tone(210, 0.6, { type: 'sawtooth', slide: 0.55, vol: 0.1, delay: 0.05 }); },
  tap: () => tone(660, 0.08, { type: 'triangle', vol: 0.1 }),
  gust: () => tone(300, 0.9, { type: 'sine', slide: 1.6, vol: 0.05 }),
};
const say = (words) => {
  if (!CFG.speech || audio.muted) return;
  const ss = window.speechSynthesis;
  if (!ss) return;
  try {
    ss.cancel();
    const u = new SpeechSynthesisUtterance(words);
    u.lang = 'en-US'; u.rate = 0.95; u.pitch = 1.15;
    ss.speak(u);
  } catch (e) { /* no voice on this device */ }
};
const hush = () => { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { /* fine */ } };

/* ================= DRAWING HELPERS ================= */
const text = (str, x, y, size, opt = {}) => {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(opt.rot || 0); ctx.scale(1 / view.S, 1 / view.S);
  const px = size * view.S;
  ctx.font = `${opt.weight || 700} ${px}px Fredoka, "Baloo 2", system-ui, sans-serif`;
  ctx.textAlign = opt.align || 'center'; ctx.textBaseline = 'middle';
  if (opt.stroke) { ctx.lineWidth = px * 0.22; ctx.lineJoin = 'round'; ctx.strokeStyle = opt.stroke; ctx.strokeText(str, 0, 0); }
  ctx.fillStyle = opt.color || '#fff';
  ctx.fillText(str, 0, 0);
  ctx.restore();
};
const emoji = (ch, x, y, size, rot = 0, flip = false) => {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale((flip ? -1 : 1) / view.S, 1 / view.S);
  ctx.font = `${size * view.S}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
  ctx.fillText(ch, 0, 0);
  ctx.restore();
};
const bubble = (str, x, y, size) => {
  ctx.save();
  ctx.translate(clamp(x, 0.16, view.W - 0.16), y); ctx.scale(1 / view.S, 1 / view.S);
  const px = size * view.S;
  ctx.font = `700 ${px}px Fredoka, system-ui, sans-serif`;
  const w = ctx.measureText(str).width + px * 1.2; const h = px * 1.9;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-px * 0.4, h / 2 - 1); ctx.lineTo(0, h / 2 + px * 0.6); ctx.lineTo(px * 0.4, h / 2 - 1); ctx.fill();
  ctx.fillStyle = '#2a2350'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(str, 0, px * 0.05);
  ctx.restore();
};
const disc = (x, y, r, color) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };
const oval = (x, y, rx, ry, color) => { ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); };
const box = (x, y, w, h, r, color) => { ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); };
const skyGrad = (stops, bottom = 1) => {
  const g = ctx.createLinearGradient(0, 0, 0, bottom);
  stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, view.W, 1);
};
const hills = (color, baseY, amp, freq, phase = 0) => {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, 1);
  for (let x = 0; x <= view.W + 0.03; x += 0.03) {
    ctx.lineTo(x, baseY - amp * (0.5 + 0.5 * Math.sin(x * freq * 3 + phase)) - amp * 0.3 * Math.sin(x * freq * 7.3 + phase * 2));
  }
  ctx.lineTo(view.W, 1); ctx.fill();
};
const groundFill = (top, bottom) => {
  const g = ctx.createLinearGradient(0, GY, 0, 1);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(0, GY + 0.02, view.W, 1);
};
const glowDisc = (x, y, r, color, halo) => {
  const g = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 2.6);
  g.addColorStop(0, halo); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, Math.PI * 2); ctx.fill();
  disc(x, y, r, color);
};

/* ================= SCENERY ================= */
const buildScene = (id) => {
  const rnd = mulberry(id.length * 7919 + id.charCodeAt(0) * 131);
  const list = (n, make) => Array.from({ length: n }, make);
  return {
    clouds: list(5, () => ({ x: rnd() * 1.2, y: 0.1 + rnd() * 0.3, s: 0.035 + rnd() * 0.035, v: 0.008 + rnd() * 0.012 })),
    stars: list(80, () => ({ x: rnd(), y: rnd() * 0.8, s: 0.0012 + rnd() * 0.0028, p: rnd() * 6 })),
    craters: list(7, () => ({ x: rnd(), y: GY + 0.05 + rnd() * 0.1, w: 0.03 + rnd() * 0.05 })),
    stones: list(8, () => ({ x: rnd(), y: GY + 0.035 + rnd() * 0.11, s: 0.01 + rnd() * 0.02 })),
  };
};
const drawClouds = (t) => {
  S.scene.clouds.forEach((c) => {
    const x = ((c.x * view.W + t * c.v) % (view.W + 0.4)) - 0.2;
    ctx.globalAlpha = 0.92;

const succeed = (off) => {

  r.y = GY; r.vx = 0; r.vy = 0; r.tilt = 0; r.thrusting = false; r.legs = 1;
  setEngine(false);

  store.best[S.diff] = store.best[S.diff] || {};
  store.best[S.diff][S.world.id] = { stars: Math.max(old.stars, res.stars), bull: old.bull || res.bull, soft: old.soft || res.soft };

const checkTouchdown = () => {
  const r = S.rocket; const d = DIFF[S.diff];

};

const PHASE = {
  demo: () => { const r = S.rocket; r.x = view.W * 0.86; r.y = 0.5 + Math.sin(S.t * 1.3) * 0.04; r.tilt = Math.sin(S.t * 0.9) * 0.05; },
  ready: () => { S.rocket.y = 0.25 + Math.sin(S.t * 2.2) * 0.008; S.rocket.thrusting = Math.sin(S.t * 9) > -0.3; },
  fly: (dt) => {
    const d = DIFF[S.diff]; const r = S.rocket;
    r.thrusting = (input.down || input.up) && r.fuel > 0;
    const ay = d.g * S.world.gmul - (r.thrusting ? CFG.thrust * d.g : 0);
    r.vx += (steerAccel() + windAccel()) * dt; r.vy += ay * dt;
    r.x += r.vx * dt; r.y += r.vy * dt;
    if (r.thrusting) r.fuel -= dt;
    keepInside(r);
    S.ceilT = r.y <= CFG.rocketH + 0.075 ? S.ceilT + dt : 0;
    r.tilt = lerp(r.tilt, clamp(r.vx * 0.8, -0.3, 0.3), 1 - Math.exp(-8 * dt));
    r.legs = clamp(r.legs + (GY - r.y < CFG.legsAt ? dt * 2.5 : -dt * 2.5), 0, 1);
    if (r.thrusting && Math.random() < 0.5) addPart({ kind: 'smoke', x: r.x + rand(-0.01, 0.01), y: r.y + 0.05, vx: rand(-0.05, 0.05), vy: rand(0.1, 0.25), life: rand(0.3, 0.6), s: rand(0.008, 0.014), c: '#f1efe9' });
    setEngine(r.thrusting);
    collectStars(); updateRocks(dt); checkTouchdown();
  },
  landed: (dt) => {
    S.landT += dt;
    S.rocket.x = padX() + S.rideOff;
    CELEBRATE_FX[S.world.id](dt);
    if (S.landT > CFG.celebrateSecs) showCard();
  },
  crashed: (dt) => {
    const r = S.rocket; S.failT += dt;
    if (S.failKind === 'splash') { r.tilt = lerp(r.tilt, S.failDir * 0.35, 0.05); r.sink = 0.03 + Math.sin(S.failT * 3) * 0.008; }
    if (S.failKind !== 'splash') r.tilt = lerp(r.tilt, S.failDir * 1.4, 1 - Math.exp(-5 * dt));
    if (S.failT > 1.5) showCard();
  },
};
const once = (key, fn) => { if (S.flags[key]) return; S.flags[key] = true; fn(); };

/* ================= CELEBRATIONS (the surprise in each world) ================= */
const CELEBRATE_FX = {
  pad: (dt) => {
    if (Math.random() > dt * 2.4) return;
    burst(rand(0.1, view.W - 0.1), rand(0.12, 0.45), 26, [pick(CONFETTI), '#ffffff'], 0.32); sfx.pop();
  },
  ship: () => {
    if (S.landT < 1.4 || Math.random() > 0.35) return;
    addPart({ x: view.W * 0.12 + rand(-0.01, 0.01), y: GY + 0.0, vx: rand(-0.06, 0.06), vy: -rand(0.25, 0.4), g: 0.7, life: 0.9, s: 0.005, c: '#d8f3ff' });
  },
  volcano: () => {
    if (S.landT < 3.6 && Math.random() < 0.6) confetti(volcanoX() + rand(-0.02, 0.02), 0.42, 2, 0.9);
    if (S.landT > 2.4) once('roar', sfx.roar);
  },
  moon: () => { if (S.landT > 1.9) once('flag', () => tone(784, 0.3, { type: 'triangle' })); },
  mars: () => { if (S.landT > 1.6) once('hi', () => { tone(900, 0.12, { type: 'square', vol: 0.08 }); tone(1200, 0.16, { type: 'square', vol: 0.08, delay: 0.12 }); }); },
};
const CELEBRATE = {
  pad: (t, r) => {
    ['🧑‍🚀', '👩‍🔧', '🧑‍🔧', '👩‍🚀'].forEach((c, i) => {
      const side = i % 2 === 0 ? -1 : 1;
      const from = side < 0 ? -0.1 : view.W + 0.1;
      const to = r.x + side * (0.1 + 0.07 * Math.floor(i / 2));
      const x = lerp(from, to, ease((t - 0.2 * i) / 1.4));
      emoji(c, x, GY - 0.02 - Math.abs(Math.sin(t * 7 + i)) * 0.04, 0.075);
    });
    if (t > 1.8) bubble(`Welcome home, ${CFG.pilot}!`, r.x, GY - CFG.rocketH - 0.09, 0.034);
  },
  ship: (t, r) => {
    const wy = GY + 0.06;
    [0, 1, 2, 3].forEach((i) => {
      const side = i % 2 === 0 ? -1 : 1;
      const tau = (t * 0.62 + i * 0.27) % 1;
      const x = r.x + side * (S.padW / 2 + 0.11 + 0.05 * Math.floor(i / 2)) - (tau - 0.5) * 0.12;
      emoji('🐬', x, wy - Math.sin(tau * Math.PI) * 0.19, 0.075, (tau - 0.5) * -1.6);
    });
    if (t > 1.2) emoji('🐳', view.W * 0.12, wy - 0.015 - ease((t - 1.2) / 1) * 0.03, 0.09, 0, true);
  },
  volcano: (t, r) => {
    const x = lerp(view.W + 0.14, Math.min(r.x + S.padW / 2 + 0.13, view.W - 0.09), ease(t / 2.2));
    emoji('🦕', x, GY - 0.06 + Math.sin(t * 6) * 0.006, 0.17);
    if (t > 2.4) bubble('ROAR! Nice landing!', x - 0.04, GY - 0.2, 0.032);
  },
  moon: (t, r) => {
    const left = r.x > 0.3;
    const fx = r.x + (left ? -0.11 : 0.11);
    const ph = 0.14 * ease((t - 0.6) / 1);
    ctx.strokeStyle = '#e8eaf2'; ctx.lineWidth = 0.004;
    ctx.beginPath(); ctx.moveTo(fx, GY + 0.02); ctx.lineTo(fx, GY + 0.02 - ph); ctx.stroke();
    const fw = 0.075 * ease((t - 1.5) / 0.5); const fh = 0.048; const fy = GY + 0.02 - ph;
    [[1, '#e0263c'], [1, '#ffffff'], [2, '#2b3a8c'], [1, '#ffffff'], [1, '#e0263c']]
      .reduce((y, [n, c]) => { ctx.fillStyle = c; ctx.fillRect(fx, y, fw, (fh * n) / 6 + 0.0005); return y + (fh * n) / 6; }, fy);
    emoji('🚙', r.x + (left ? 0.07 : -0.07) + (left ? 1 : -1) * ease((t - 0.8) / 2.6) * 0.2, GY, 0.06, 0, left);
    const ax = clamp(fx + (left ? -0.1 : 0.1), 0.06, view.W - 0.06);
    emoji('🧑‍🚀', ax, GY - 0.02 - Math.abs(Math.sin(t * 1.5)) * 0.14, 0.075);
    if (t > 2.2) bubble(`One small step for ${CFG.pilot}!`, r.x, GY - CFG.rocketH - 0.1, 0.032);
  },
  mars: (t, r) => {
    const ax = clamp(r.x + S.padW / 2 + 0.1, 0.08, view.W - 0.08);
    emoji('👽', ax, GY + 0.05 - ease((t - 0.8) / 0.8) * 0.11, 0.085, Math.sin(t * 5) * 0.2);
    oval(ax, GY + 0.045, 0.065, 0.035, '#7d3420');
    emoji('🛸', ((t * 0.22) % 1.3 - 0.15) * view.W, 0.2 + Math.sin(t * 3) * 0.03, 0.085);
    if (t > 1.8) bubble(`Hi ${CFG.pilot}!`, ax, GY - 0.16, 0.034);
  },
};

/* ================= HUD ON THE CANVAS ================= */
const drawGauges = () => {
  const d = DIFF[S.diff]; const r = S.rocket;
  const gx = 0.03; const gy = 0.3; const gh = 0.34; const gw = 0.026;
  const max = d.safe * 2.6;
  box(gx - 0.006, gy - 0.006, gw + 0.012, gh + 0.012, 0.012, 'rgba(26,28,74,.8)');
  const safeH = gh * (d.safe / max);
  box(gx, gy, gw, gh - safeH, 0.006, '#ff5d6c');
  box(gx, gy + gh - safeH, gw, safeH, 0.006, '#2fd39a');
  const v = clamp(S.phase === 'fly' ? r.vy : 0, 0, max);
  const ny = gy + gh - gh * (v / max);
  box(gx - 0.012, ny - 0.006, gw + 0.024, 0.012, 0.006, '#fff');
  text('SPEED', gx + gw / 2 + 0.012, gy - 0.03, 0.022, { stroke: '#1a1c4a' });
  text('OK', gx + gw / 2, gy + gh - safeH / 2, 0.016, { color: '#0b4a35' });
  if (d.fuel === Infinity) return;
  const fx = view.W - 0.03 - gw;
  box(fx - 0.006, gy - 0.006, gw + 0.012, gh + 0.012, 0.012, 'rgba(26,28,74,.8)');
  const f = clamp(r.fuel / d.fuel, 0, 1);
  box(fx, gy + gh * (1 - f), gw, gh * f, 0.006, f < 0.25 ? '#ff5d6c' : '#ffb11f');
  text('FUEL', fx + gw / 2 - 0.012, gy - 0.03, 0.022, { stroke: '#1a1c4a' });
};
const drawHints = () => {
  const r = S.rocket; const px = padX();
  if (S.phase === 'ready') {
    const bob = Math.sin(S.t * 5) * 0.012;
    text('LAND HERE', px, GY - 0.13 + bob, 0.036, { stroke: '#1a1c4a', color: '#ffd23f' });
    text('▼', px, GY - 0.075 + bob, 0.05, { stroke: '#1a1c4a', color: '#ffd23f' });
    const size = Math.min(0.05, view.W * 0.068);
    const cx = view.W / 2 + size * 0.7;
    text('Hold to fire the engine', cx, 0.945, size, { stroke: '#1a1c4a' });
    emoji('👆', cx - size * 6.6, 0.94 - Math.abs(Math.sin(S.t * 4)) * 0.015, size * 1.5);
    return;
  }
  if (S.phase !== 'fly') return;
  if (S.ceilT > 1.2) text('Let go to come down', view.W / 2, 0.36, Math.min(0.042, view.W * 0.07), { stroke: '#1a1c4a' });
  if (gustOn()) text(S.gust.a > 0 ? '💨 WIND ▶' : '◀ WIND 💨', view.W / 2, 0.2, 0.036, { stroke: '#7d3420', color: '#fff3df' });
  if (r.fuel <= 0) text('No fuel!', r.x, r.y - CFG.rocketH - 0.04, 0.034, { stroke: '#fff', color: '#e0263c' });
  if (speedState() !== 'fast' || GY - r.y > 0.32 || Math.sin(S.t * 14) < 0) return;
  text('TOO FAST!', clamp(r.x, 0.14, view.W - 0.14), r.y - CFG.rocketH - 0.04, 0.04, { stroke: '#fff', color: '#e0263c' });
};
const drawStars = () => {
  if (S.phase !== 'ready' && S.phase !== 'fly') return;
  S.stars.filter((s) => !s.got).forEach((s, i) => {
    glowDisc(s.x, s.y, 0.012, 'rgba(255,240,150,.0)', 'rgba(255,230,120,.55)');
    emoji('⭐', s.x, s.y + Math.sin(S.t * 3 + i) * 0.008, 0.062, Math.sin(S.t * 2 + i) * 0.2);
  });
};
const drawRocks = () => S.rocks.forEach((k) => { glowDisc(k.x, k.y, 0.016, '#5a2a1a', 'rgba(255,140,30,.75)'); disc(k.x - 0.004, k.y - 0.004, 0.006, '#ff9a3c'); });

/* ================= FRAME ================= */
const draw = () => {
  const k = view.dpr * view.S;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  BACKDROP[S.world.id](S.t);
  if (S.phase !== 'demo') drawPad();
  drawStars(); drawRocks();
  if (S.phase !== 'demo' || view.W >= 1.15) drawRocket(S.rocket);
  if (S.phase === 'landed') CELEBRATE[S.world.id](S.landT, S.rocket);
  drawParts();
  drawFront(S.t);
  if (S.phase === 'ready' || S.phase === 'fly') drawGauges();
  drawHints();
  if (S.phase !== 'landed' || S.landT > 1.8) return;
  const size = Math.min(0.12, view.W * 0.15) * (0.6 + 0.4 * ease(S.landT / 0.35));
  text('TOUCHDOWN!', view.W / 2, 0.3, size, { stroke: '#1a1c4a', color: '#ffd23f' });
};
const frame = (now) => {
  const dt = Math.min(0.033, (now - S.last) / 1000 || 0);
  S.last = now; S.t += dt;
  updateParts(dt);
  PHASE[S.phase](dt);
  draw();
  requestAnimationFrame(frame);
};
const resize = () => {
  const b = cv.getBoundingClientRect();
  view.dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.S = Math.max(1, b.height); view.W = Math.max(0.3, b.width / view.S);
  cv.width = Math.round(b.width * view.dpr); cv.height = Math.round(b.height * view.dpr);
  S.padW = Math.min(DIFF[S.diff].padW, view.W * 0.62);
};

/* ================= SCREENS ================= */
const buildDiffs = () => {
  const row = $('diffs'); row.textContent = '';
  Object.keys(DIFF).forEach((key) => {
    const b = document.createElement('button');
    b.className = 'diff'; b.id = `d-${key}`;
    b.setAttribute('aria-pressed', String(key === S.diff));
    b.innerHTML = `<span class="d-icon">${DIFF[key].icon}</span>${DIFF[key].label}`;
    b.addEventListener('click', () => { S.diff = key; store.diff = key; save(); sfx.tap(); buildDiffs(); });
    row.appendChild(b);
  });
};
const buildMap = () => {
  const grid = $('worlds'); grid.textContent = '';
  const next = WORLDS.find((w) => !bestOf(S.diff, w.id));
  WORLDS.forEach((w) => {
    const best = bestOf(S.diff, w.id);
    const n = best ? best.stars : 0;
    const b = document.createElement('button');
    b.className = w === next ? 'world next' : 'world'; b.id = `w-${w.id}`;
    b.innerHTML = `<span class="w-icon">${w.icon}</span><span class="w-name">${w.name}</span>`
      + `<span class="w-stars">${'★'.repeat(n)}${'☆'.repeat(3 - n)}</span>`
      + `<span class="w-grav">Gravity ${w.gravity} m/s²</span>`
      + (best ? '<span class="w-done">✓ Landed</span>' : '');
    b.addEventListener('click', () => { sfx.tap(); startMission(w); });
    grid.appendChild(b);
  });
  $('trophy').hidden = Boolean(next);
};
const openMap = () => { goDemo(); buildMap(); showScreen('map'); };
const nextWorld = () => WORLDS[WORLDS.indexOf(S.world) + 1] || null;
const showCard = () => {
  if (S.cardShown) return;
  S.cardShown = true; setEngine(false);
  const res = S.result; const nw = nextWorld();
  $('c-stars').hidden = !res.ok; $('c-badges').hidden = !res.ok; $('c-fact').hidden = !res.ok;
  $('c-tip').hidden = res.ok; $('b-again').hidden = !res.ok;
  showScreen('card');
  $('b-primary').focus({ preventScroll: true });
  if (!res.ok) {
    $('c-title').textContent = FAIL[res.kind].title;
    $('c-tip').textContent = `${FAIL[res.kind].tip} Every engineer tries again!`;
    $('b-primary').textContent = 'Try again 🚀';
    return;
  }
  $('c-title').textContent = S.world.landed;
  $('c-stars').textContent = '★'.repeat(res.stars) + '☆'.repeat(3 - res.stars);
  const badges = [res.bull ? '🎯 Bullseye' : '', res.soft ? '🪶 Soft landing' : ''].filter(Boolean);
  $('c-badges').innerHTML = badges.map((b) => `<span class="badge">${b}</span>`).join('');
  $('c-fact').textContent = S.world.fact;
  $('b-primary').textContent = nw ? `Next: ${nw.name} ▶` : 'See the map 🏆';
};

$('b-play').addEventListener('click', () => { initAudio(); sfx.tap(); openMap(); });
$('b-back').addEventListener('click', () => { sfx.tap(); goDemo(); showScreen('title'); });
$('b-home').addEventListener('click', () => { sfx.tap(); openMap(); });
$('b-map').addEventListener('click', () => { sfx.tap(); openMap(); });
$('b-again').addEventListener('click', () => { sfx.tap(); startMission(S.world); });
$('b-primary').addEventListener('click', () => {
  sfx.tap();
  if (!S.result.ok) { startMission(S.world); return; }
  const nw = nextWorld();
  if (nw) { startMission(nw); return; }
  openMap();
});
const paintMute = () => { $('b-mute').textContent = audio.muted ? '🔇' : '🔊'; };
$('b-mute').addEventListener('click', () => {
  audio.muted = !audio.muted; store.muted = audio.muted; save(); paintMute();
  if (audio.muted) { setEngine(false); hush(); }
});

/* ================= INPUT ================= */
const worldX = (e) => (e.clientX - cv.getBoundingClientRect().left) / view.S;
const beginFlight = () => { if (S.phase === 'ready') S.phase = 'fly'; };
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); initAudio();
  if (S.phase === 'landed' && S.landT > 1.5) { showCard(); return; }
  input.down = true; input.x = worldX(e);
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
  beginFlight();
});
cv.addEventListener('pointermove', (e) => { if (input.down) input.x = worldX(e); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach((ev) => cv.addEventListener(ev, () => { input.down = false; }));
cv.addEventListener('contextmenu', (e) => e.preventDefault());
const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ' ': 'up', a: 'left', d: 'right', w: 'up' };
window.addEventListener('keydown', (e) => {
  const k = KEYS[e.key];
  if (!k || S.phase === 'demo' || !$('card').hidden) return;
  e.preventDefault(); initAudio(); input[k] = true;
  if (k === 'up') beginFlight();
});
window.addEventListener('keyup', (e) => { const k = KEYS[e.key]; if (k) input[k] = false; });
window.addEventListener('blur', () => { input.down = false; input.up = false; input.left = false; input.right = false; setEngine(false); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setEngine(false); });
window.addEventListener('resize', resize);

/* ================= GO ================= */
$('t-eyebrow').textContent = `${CFG.rocketName} · Mission: come home`;
resize(); goDemo(); buildDiffs(); paintMute();
window.LTR = { S, CFG, DIFF, WORLDS, view, padX, startMission, succeed, fail };   // handy for tuning from the console
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
